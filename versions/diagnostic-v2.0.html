<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths readiness diagnostic (v2)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F7F8F6; --ink:#1E2A32; --ink-soft:#4A5860; --rule:#D5DBDD;
  --field:#FFFFFF; --accent:#2A6F8F; --accent-ink:#FFFFFF; --wash:#E8F0F4;
  --good:#3B7A57; --bad:#B4553A; --warn:#8A6D1F; --good-wash:#E6F0EA; --bad-wash:#F5E6E1; --warn-wash:#F3ECD6;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B;
  --field:#1F262B; --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
  --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620; --warn-wash:#3A3320;
}}
:root[data-theme="dark"]{
  --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B;
  --field:#1F262B; --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
  --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620; --warn-wash:#3A3320;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 5rem}
main.wide{max-width:70rem}
h1{font-size:1.85rem;line-height:1.2;margin:0 0 .75rem;font-weight:700}
h2{font-size:1.3rem;margin:2.25rem 0 .75rem;font-weight:700}
h3{font-size:1.05rem;margin:1.5rem 0 .5rem;font-weight:700}
p{margin:0 0 1rem}
p.lead{font-size:1.1rem;color:var(--ink-soft)}
a{color:var(--accent)}
small,.muted{color:var(--ink-soft)}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
button,.btn{font:inherit;font-size:1rem;padding:.6rem 1.1rem;border-radius:.4rem;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.quiet,.btn.quiet{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
input[type=text],input[type=number],select{font:inherit;font-size:1rem;padding:.5rem .65rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);color:var(--ink);max-width:100%}
input[type=text]{width:100%}
label.check{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
label.check input{margin-top:.3rem;width:1.05rem;height:1.05rem;flex:none}
fieldset{border:1px solid var(--rule);border-radius:.5rem;padding:.75rem 1rem 1rem;margin:0 0 1.25rem}
legend{padding:0 .4rem;font-weight:700}
.topic-block{margin:0 0 1rem}
.topic-block .skills{padding-left:1.7rem}
.notice{background:var(--wash);border-left:4px solid var(--accent);padding:.75rem 1rem;border-radius:0 .4rem .4rem 0;margin:1rem 0}
.notice.bad{border-color:var(--bad);background:var(--bad-wash)}
.notice.good{border-color:var(--good);background:var(--good-wash)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.urlbox{display:block;width:100%;padding:.75rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);word-break:break-all;margin:.5rem 0}
/* the sitting */
.topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);padding:.6rem 0;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;z-index:2}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.item{padding:1.5rem 0 1.75rem;border-bottom:1px solid var(--rule)}
.item:last-of-type{border-bottom:0}
.item .num{color:var(--ink-soft);margin-bottom:.35rem}
.stem{font-size:1.25rem;line-height:1.45;margin:0 0 1rem}
.stem .katex{font-size:1.05em}
label.opt .katex{font-size:1.05em}
.plot{width:100%;max-width:280px;height:auto;display:block;margin:.5rem 0 1rem}
.opts{display:grid;gap:.5rem;margin:0}
.opts.figs{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
label.opt{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border:1.5px solid var(--rule);border-radius:.5rem;background:var(--field);cursor:pointer;font-size:1.08rem}
label.opt input{width:1.15rem;height:1.15rem;flex:none;margin:0}
label.opt:has(input:checked){border-color:var(--accent);background:var(--wash)}
label.opt .plot{margin:0;max-width:100%}
label.opt.fig{flex-direction:column;align-items:stretch}
label.opt.fig .plot{max-width:none}
label.opt.fig .caption{display:flex;gap:.6rem;align-items:center}
.opt.idk{color:var(--ink-soft)}
.opts.figs .opt.idk{grid-column:1/-1;justify-content:center}
.conf{margin-top:.75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--ink-soft)}
.conf button{padding:.3rem .7rem;font-size:.92rem;border-color:var(--rule);background:transparent;color:var(--ink)}
.conf button.on{border-color:var(--accent);background:var(--wash)}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:.4rem}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.result-list{list-style:none;padding:0;margin:0}
.result-list li{padding:.6rem 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1.6rem 1fr auto;gap:.6rem;align-items:baseline}
.mark{font-weight:700}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}.mark.skip{color:var(--ink-soft)}
/* analysis */
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.5rem 0 1.5rem}
th,td{text-align:left;padding:.45rem .55rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700}
.scroll{overflow-x:auto}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:2.6rem}
.heat th.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:400;white-space:nowrap;padding:.3rem}
.tier{padding:.05rem .4rem;border-radius:.3rem;font-size:.8em}
.tier.t1{background:var(--wash)} .tier.t2{background:var(--good-wash)} .tier.t3{background:var(--bad-wash)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.5rem;align-items:start}
.chart{width:100%;height:auto;display:block;margin:.25rem 0 1rem}
button.small{padding:.3rem .7rem;font-size:.9rem}
.band{font-weight:700}
details.card{border:1px solid var(--rule);border-radius:.5rem;padding:.5rem .9rem;margin:.5rem 0}
details.card[open]{padding-bottom:1rem}
details.card .chart{max-width:420px}
.tag{display:inline-block;padding:.1rem .45rem;border-radius:.3rem;background:var(--wash);font-size:.9em;margin:.1rem .2rem .1rem 0}
details{margin:.5rem 0}
summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
@media (max-width:600px){html{font-size:16px} main{padding:1.5rem 1rem 4rem} .stem{font-size:1.15rem}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ==========================================================================

   never reorder: a skill's position is its bit in the share code.

  {id:"matrix",   topic:"seq", name:"Matrices",                                    tier:3, mod:"MC"}
];

const ERRORS = {
  "ord-left-to-right":"Works left to right, ignoring that multiplication comes before addition",
  "ord-op-confusion":"Treats × as + (or loses an operation)",
  "ord-power-scope":"Applies the power to the wrong part (e.g. squares the product instead of the base)",

  "ord-div-mul-order":"Does multiplication before division instead of left to right",
  "neg-magnitudes":"Subtracts magnitudes instead of moving further negative",
  "neg-sign-flip":"Gets the magnitude right but the sign wrong",
  "neg-sign-dropped":"Drops the negative sign entirely",

  "neg-mult-as-add":"Adds the numbers instead of multiplying",
  "neg-double-minus":"Mishandles subtracting a negative",

  "frac-scale-den-only":"Scales the denominator but not the numerator",
  "frac-bigger-numbers-bigger":"Thinks the fraction with bigger numbers is bigger",
  "frac-larger-den-larger":"Thinks a larger denominator means a larger fraction",

  "dec-place-value":"Misreads decimal place value",
  "dec-digits-as-fraction":"Turns the decimal digits into a fraction without regard to place value",
  "dec-approximation":"Substitutes a nearby familiar fraction",
  "dec-longer-is-larger":"Thinks a decimal with more digits is larger",
  "dec-equal":"Treats two different decimals as equal",
  "dec-ignore-point":"Ignores the decimal point",
  "round-truncate":"Truncates instead of rounding",
  "round-wrong-place":"Rounds to the wrong number of places",
  "round-to-integer":"Rounds to a whole number instead of the requested place",
  "pct-not-scaled":"Converts to a decimal but forgets to multiply by 100",
  "pct-halved":"Uses the numerator as tens (2/5 read as 20%)",
  "pct-inverted":"Inverts the fraction before converting",
  "pct-subtracted":"Subtracts the percentage as a number instead of finding a fraction of the amount",
  "pct-decimal-slip":"Correct method but the decimal point is misplaced",
  "pct-divided":"Divides by the percentage instead of multiplying by it as a fraction",
  "pct-reverse-multiplied":"Reverses a discount by multiplying the sale price by (1 + rate) instead of dividing by (1 − rate)",
  "pct-reverse-added":"Adds the discount percentage of the sale price back on",
  "pct-as-amount":"Treats the percentage as a number of euro",
  "pct-found-not-added":"Finds the percentage but forgets to add it to the original",
  "pct-decimal":"Adds the decimal form of the percentage instead of the amount",
  "ratio-divide-by-part":"Divides the total by one part of the ratio instead of the sum of parts",

  "ratio-parts-only":"Finds the value of one part and stops",

  "ratio-additive":"Adds the same amount as the difference in people, instead of scaling",
  "ratio-inverted":"Scales the wrong way (divides instead of multiplies)",
  "est-magnitude":"Estimate is out by a factor of ten",

  "unit-wrong-direction":"Converts units the wrong way",

  "unit-concatenate":"Writes the two unit values side by side instead of converting",
  "eq-sign-as-answer":"Reads the equals sign as \"the answer is\" rather than as a balance",

  "not-add-count":"Reads 3n as 3 + n",

  "ind-reciprocal-as-root":"Confuses a reciprocal with a root",

/* ==========================================================================
   UTILITIES
   ========================================================================== */
const $ = s => document.querySelector(s);
const app = typeof document !== "undefined" ? document.getElementById("app") : null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const skillById = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const pctStr = p => p === null || p === undefined ? "–" : Math.round(p * 100) + "%";

function tex(str){
  const parts = String(str).split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if(p.startsWith("$") && p.endsWith("$") && p.length > 2){
      const src = p.slice(1, -1);
      if(typeof katex !== "undefined"){ try { return katex.renderToString("\\displaystyle " + src, {throwOnError:false}); } catch(e){} }
      return "<code>" + esc(src) + "</code>";
    }
    return esc(p);

}
function plainText(str){ return String(str).replace(/\$/g,"").replace(/\\(frac|dfrac|tfrac)\{([^}]*)\}\{([^}]*)\}/g,"$2/$3").replace(/\\(times|cdot)/g,"×").replace(/\\(le|leq)/g,"≤").replace(/\\(ge|geq)/g,"≥").replace(/\\neq/g,"≠").replace(/\\sqrt\{([^}]*)\}/g,"√($1)").replace(/\\left|\\right|\\displaystyle/g,"").replace(/\\,/g," ").replace(/\\%/g,"%").replace(/\\pi/g,"π").replace(/\\(log|sin|cos|tan|lim|sum|prod|binom|text|circ|ldots|land|lnot|oplus|cap|cup|square|theta)/g,"$1").replace(/\\begin\{pmatrix\}/g,"[").replace(/\\end\{pmatrix\}/g,"]").replace(/\\\\/g,";").replace(/[{}]/g,""); }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function plotSVG(fig, small){
  const w = small ? 200 : 280, h = small ? 160 : 220, pad = 22;
  const [x0, x1] = fig.x, [y0, y1] = fig.y, [dx, dy] = fig.ticks || [1, 1];
  const sx = x => pad + (x - x0) / (x1 - x0) * (w - 2 * pad);
  const sy = y => h - pad - (y - y0) / (y1 - y0) * (h - 2 * pad);
  let s = `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(fig.label || "graph")}">`;
  s += `<rect x="${pad}" y="${pad}" width="${w - 2 * pad}" height="${h - 2 * pad}" fill="var(--field)" stroke="none"/>`;
  for(let x = Math.ceil(x0); x <= x1; x += dx){ s += `<line x1="${sx(x)}" y1="${pad}" x2="${sx(x)}" y2="${h - pad}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || x % (2 * dx) === 0) s += `<text x="${sx(x)}" y="${h - pad + 14}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${x}</text>`; }
  for(let y = Math.ceil(y0); y <= y1; y += dy){ s += `<line x1="${pad}" y1="${sy(y)}" x2="${w - pad}" y2="${sy(y)}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || y % (2 * dy) === 0) s += `<text x="${pad - 4}" y="${sy(y) + 3.5}" font-size="10" text-anchor="end" fill="var(--ink-soft)">${y}</text>`; }
  if(x0 <= 0 && x1 >= 0) s += `<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${h - pad}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  if(y0 <= 0 && y1 >= 0) s += `<line x1="${pad}" y1="${sy(0)}" x2="${w - pad}" y2="${sy(0)}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  s += `<text x="${w - pad + 4}" y="${(y0 <= 0 && y1 >= 0) ? sy(0) + 4 : h - pad}" font-size="11" fill="var(--ink-soft)" font-style="italic">x</text>`;
  s += `<text x="${(x0 <= 0 && x1 >= 0) ? sx(0) + 4 : pad}" y="${pad - 6}" font-size="11" fill="var(--ink-soft)" font-style="italic">y</text>`;
  for(const f of fig.fns){
    const fn = new Function("x", "return " + f);
    let d = "", pen = false;
    for(let i = 0; i <= 160; i++){
      const x = x0 + (x1 - x0) * i / 160; const y = fn(x);
      if(!isFinite(y) || y < y0 - 0.5 || y > y1 + 0.5){ pen = false; continue; }
      d += (pen ? " L" : " M") + sx(x).toFixed(1) + " " + sy(Math.max(y0, Math.min(y1, y))).toFixed(1); pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  return s + "</svg>";
}

/* ==========================================================================
   CONFIGURATION AND THE SHARE CODE (format 2)
   ========================================================================== */
const ORDERS = ["Mixed together", "Easiest first", "Hardest first", "Grouped by topic"];
const DEFAULT_CFG = {v:2, lang:0, ident:1, idk:true, conf:false, showScore:true, showItems:true, showAnswers:false, allowBack:true, order:0, drop:false, perSkill:2, viewLock:0, k:5, timer:0, maxQ:0, skills:SKILLS.map(s => s.id), seed:1, label:""};

function encodeCfg(c){
  const b = [2, c.lang | c.ident << 2 | (c.idk ? 16 : 0) | (c.conf ? 32 : 0) | (c.showScore ? 64 : 0) | (c.showItems ? 128 : 0),
    c.perSkill | c.viewLock << 2 | (c.k & 15) << 4,
    (c.showAnswers ? 1 : 0) | (c.allowBack ? 2 : 0) | (c.order & 3) << 2 | (c.drop ? 16 : 0),
    c.timer & 255, c.maxQ & 255];
  const nb = Math.ceil(SKILLS.length / 8); b.push(nb);
  const mask = new Array(nb).fill(0);
  c.skills.forEach(id => { const i = SKILLS.findIndex(s => s.id === id); if(i >= 0) mask[i >> 3] |= 1 << (i & 7); });
  b.push(...mask, c.seed & 255, c.seed >>> 8 & 255);
  return b64uEncode(Uint8Array.from([...b, ...new TextEncoder().encode(c.label || "")]));
}
function decodeCfg(code){
  const u = b64uDecode(code); if(u.length < 10 || u[0] !== 2) throw new Error("bad code");
  const c = {v:2};
  c.lang = u[1] & 3; c.ident = u[1] >> 2 & 3; c.idk = !!(u[1] & 16); c.conf = !!(u[1] & 32); c.showScore = !!(u[1] & 64); c.showItems = !!(u[1] & 128);
  c.perSkill = u[2] & 3 || 1; c.viewLock = u[2] >> 2 & 3; c.k = u[2] >> 4 & 15 || 5;
  c.showAnswers = !!(u[3] & 1); c.allowBack = !!(u[3] & 2); c.order = u[3] >> 2 & 3; c.drop = !!(u[3] & 16);
  c.timer = u[4]; c.maxQ = u[5];
  const nb = u[6]; c.skills = SKILLS.filter((s, i) => (i >> 3) < nb && (u[7 + (i >> 3)] & (1 << (i & 7)))).map(s => s.id);
  const p = 7 + nb; c.seed = u[p] | u[p + 1] << 8;
  c.label = new TextDecoder().decode(u.slice(p + 2));
  return c;
}
function baseUrl(){ return location.href.split("#")[0]; }

function assemble(cfg){
  const rng = mulberry32(cfg.seed * 7919 + 17);
  const chosen = shuffle(SKILLS.filter(s => cfg.skills.includes(s.id)), rng);
  const pools = chosen.map(s => shuffle(ITEMS.filter(it => it.skill === s.id), rng).slice(0, cfg.perSkill));
  let items = [];
  for(let r = 0; r < cfg.perSkill; r++) pools.forEach(p => { if(p[r]) items.push(p[r]); });
  if(cfg.maxQ && items.length > cfg.maxQ) items = items.slice(0, cfg.maxQ);
  items = shuffle(items, rng);
  const tier = it => skillById[it.skill].tier, ti = it => TOPICS.findIndex(t => t.id === skillById[it.skill].topic);
  if(cfg.order === 1) items.sort((a, b) => tier(a) - tier(b));
  if(cfg.order === 2) items.sort((a, b) => tier(b) - tier(a));
  if(cfg.order === 3) items.sort((a, b) => ti(a) - ti(b) || tier(a) - tier(b));
  return items.map(it => {
    const variant = cfg.lang === 2 ? (rng() < 0.5 ? "plain" : "tech") : (cfg.lang === 1 ? "tech" : "plain");
    const opts = shuffle(it.opts.map((o, i) => ({...o, src:i})), rng);
    if(cfg.idk) opts.push({t:"I don't know", idk:1});
    return {item:it, tier:tier(it), variant, opts};
  });
}

/* ==========================================================================
   RESULT BUILDER (pure: used by the sitting and by the sample class)
   ========================================================================== */
function buildResult(st){
  const {plan, skipped, cfg, answers} = st;
  const skills = {}, tiers = {};
  const rec = (p, n, a, isSkipped) => {
    const it = p.item, sk = skillById[it.skill];
    if(!skills[sk.id]) skills[sk.id] = {name:sk.name, topic:sk.topic, tier:sk.tier, total:0, correct:0, idk:0, unanswered:0, skipped:0, errors:[]};
    if(!tiers[sk.tier]) tiers[sk.tier] = {total:0, correct:0, idk:0, unanswered:0, skipped:0};
    const S = skills[sk.id], T = tiers[sk.tier];
    const r = {n, id:it.id, skill:sk.id, topic:sk.topic, tier:sk.tier, variant:p.variant, answered:!!a && !isSkipped, skipped:!!isSkipped, choice:null, correct:null, error:null, confidence:a ? a.conf || null : null, seconds:a ? a.seconds : null};
    if(isSkipped){ S.skipped++; T.skipped++; return r; }
    S.total++; T.total++;
    if(!a){ S.unanswered++; T.unanswered++; return r; }
    if(a.choice === "idk"){ r.choice = "I don't know"; r.correct = false; S.idk++; T.idk++; return r; }
    const o = p.opts[a.choice]; r.choice = plainText(o.t); r.position = a.choice; r.correct = !!o.ok; r.error = o.e || null;
    if(o.ok){ S.correct++; T.correct++; } else if(o.e) S.errors.push(o.e);
    return r;
  };
  const items = plan.map((p, i) => rec(p, i + 1, answers[p.item.id], false)).concat((skipped || []).map((p, i) => rec(p, plan.length + i + 1, null, true)));
  const answered = items.filter(i => i.answered).length, correct = items.filter(i => i.correct).length, total = plan.length;
  return {
    schema:"dewmath-result/2", bankVersion:BANK_VERSION, generatedAt:new Date(st.finishedAt || Date.now()).toISOString(),
    config:{code:st.code, label:cfg.label, language:["plain", "technical", "mixed"][cfg.lang], identityMode:["anonymous", "pseudonym", "code", "name"][cfg.ident], timerMinutes:cfg.timer, order:ORDERS[cfg.order], dropOffered:cfg.drop, perSkill:cfg.perSkill, maxQuestions:cfg.maxQ, skills:cfg.skills},
    student:{identity:st.ident || null}, viewMode:["", "one-at-a-time", "all-at-once", "paged"][st.vm],
    elapsedSeconds:st.elapsed, timedOut:!!st.timedOut,
    items, summary:{total, answered, correct, idk:items.filter(i => i.choice === "I don't know").length, skipped:(skipped || []).length, skills, tiers},
    dictionary:{skills:Object.fromEntries(Object.keys(skills).map(k => [k, skillById[k].name])), topics:Object.fromEntries(TOPICS.map(t => [t.id, t.name])), tiers:TIERS, errors:Object.fromEntries([...new Set(items.map(i => i.error).filter(Boolean))].map(e => [e, ERRORS[e] || e]))}
  };
}

function simulateClass(){
  const cfg = {...DEFAULT_CFG, lang:2, conf:true, ident:3, timer:90, seed:4242, label:"Sample class (simulated)"};
  const code = encodeCfg(cfg), plan = assemble(cfg), start = Date.parse("2026-09-14T10:00:00Z");
  return PERSONAS.map((P, k) => {
    const rng = mulberry32(1000 + k * 97), answers = {}; let elapsed = 0, done = 0;
    const limit = P.stopAt ? Math.floor(plan.length * P.stopAt) : plan.length;
    for(const p of plan){
      if(done >= limit) break; done++;
      const sk = skillById[p.item.skill];
      let pc = P.p[sk.tier]; if(P.topic && P.topic[sk.topic] !== undefined) pc = Math.min(pc, P.topic[sk.topic]);
      if(P.techPenalty && p.variant === "tech") pc -= P.techPenalty;
      const right = rng() < pc;
      const wrong = p.opts.map((o, i) => i).filter(i => !p.opts[i].ok && !p.opts[i].idk);
      let choice;
      if(right) choice = p.opts.findIndex(o => o.ok);
      else if(rng() < P.idk) choice = "idk";
      else choice = wrong[Math.floor(rng() * wrong.length)];
      let conf;
      const r = rng();
      if(P.conf === "over") conf = r < .85 ? "Sure" : "Fairly sure";
      else if(P.conf === "under") conf = r < .15 ? "Sure" : r < .6 ? "Fairly sure" : "Guessing";
      else if(P.conf === "guess") conf = r < .3 ? "Sure" : r < .5 ? "Fairly sure" : "Guessing";
      else conf = right ? (r < .7 ? "Sure" : r < .95 ? "Fairly sure" : "Guessing") : (r < .2 ? "Sure" : r < .55 ? "Fairly sure" : "Guessing");
      const seconds = Math.max(6, Math.round((12 + sk.tier * 8 + rng() * 22) * P.speed));
      elapsed += seconds;
      answers[p.item.id] = {choice, conf, seconds};
    }
    return buildResult({plan, skipped:[], cfg, answers, code, ident:P.name, vm:1, elapsed:P.stopAt ? cfg.timer * 60 : elapsed, timedOut:!!P.stopAt, finishedAt:start + k * 60000 + elapsed * 1000});
  });
}

    $("#count").innerHTML = plan.length ? `<strong>${plan.length} questions</strong> (${byTier.map((n, i) => n + " " + TIERS[i + 1].toLowerCase()).join(", ")}), roughly ${Math.ceil(plan.length * 1.25)} minutes at a steady pace.` : "No skills selected yet.";

  };
  app.querySelectorAll("[data-topic]").forEach(t => t.addEventListener("change", () => { app.querySelectorAll("[data-skill]").forEach(s => { if(skillById[s.dataset.skill].topic === t.dataset.topic) s.checked = t.checked; }); sync(); }));
  app.querySelectorAll("[data-tier]").forEach(b => b.addEventListener("click", () => { const ts = b.dataset.tier; app.querySelectorAll("[data-skill]").forEach(s => { s.checked = ts.includes(String(skillById[s.dataset.skill].tier)); }); sync(); }));
  app.querySelectorAll("[data-mod]").forEach(b => b.addEventListener("click", () => { app.querySelectorAll("[data-skill]").forEach(s => { s.checked = skillById[s.dataset.skill].mod.includes(b.dataset.mod); }); sync(); }));
  $("#timerPreset").addEventListener("change", e => { if(e.target.value !== "custom"){ $("#timer").value = e.target.value; } sync(); });
  $("#timer").addEventListener("input", () => { const v = +$("#timer").value || 0; $("#timerPreset").value = TIMER_PRESETS.includes(v) ? String(v) : "custom"; });
  app.querySelectorAll("input, select").forEach(el => el.addEventListener("input", sync));
  $("#reseed").addEventListener("click", () => { cfg.seed = Math.floor(Math.random() * 65536); sync(); });
  $("#copy").addEventListener("click", () => { navigator.clipboard.writeText($("#url").textContent).then(() => { $("#copy").textContent = "Copied"; setTimeout(() => $("#copy").textContent = "Copy link", 1500); }); });
  sync();
}

/* ==========================================================================
   STUDENT: THE SITTING
   ========================================================================== */
function startRun(code, c, plan, ident, vm, saved){
  const pageSize = vm === 1 ? 1 : vm === 2 ? plan.length : c.k;
  run = {code, c, plan:plan.slice(), skipped:[], ident, vm, pageSize, page:0, answers:{}, started:Date.now(), lastEvent:Date.now(), timedOut:false, finished:false, offered:{}, offer:null};
  if(saved){
    run.answers = saved.answers || {}; run.started = saved.started || run.started; run.page = saved.page || 0; run.offered = saved.offered || {};
    if(saved.skippedIds){ run.skipped = run.plan.filter(p => saved.skippedIds.includes(p.item.id)); run.plan = run.plan.filter(p => !saved.skippedIds.includes(p.item.id)); }
  }
  if(c.timer){ run.deadline = run.started + c.timer * 60000; run.tick = setInterval(tickTimer, 1000); }
  renderPage();
}
function persist(){ if(run && !run.finished) localStorage.setItem("dewmath2:" + run.code, JSON.stringify({answers:run.answers, started:run.started, page:run.page, offered:run.offered, skippedIds:run.skipped.map(p => p.item.id)})); }
function tickTimer(){
  const el = $("#timer"); if(!run || run.finished) return;
  const left = Math.max(0, run.deadline - Date.now());
  if(el){ const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); el.textContent = `${m}:${String(s).padStart(2, "0")} left`; el.classList.toggle("low", left < 120000); }
  if(left <= 0){ run.timedOut = true; finishRun(); }
}
/* The drop-a-level check, after each answer in hardest-first mode. */
function checkDrop(tier){
  const {c, plan, answers} = run;
  if(!c.drop || c.order !== 2 || run.vm === 2 || run.offered[tier]) return;
  const done = plan.filter(p => p.tier === tier && answers[p.item.id]);
  if(done.length < 4) return;
  const last4 = done.slice(-4), misses = last4.filter(p => { const a = answers[p.item.id]; return a.choice === "idk" || !p.opts[a.choice].ok; }).length;
  const remaining = plan.filter(p => p.tier === tier && !answers[p.item.id]).length;
  const lowerExists = plan.some(p => p.tier < tier && !answers[p.item.id]);
  if(misses >= 3 && remaining > 0 && lowerExists){ run.offered[tier] = true; run.offer = {tier, remaining}; persist(); showOffer(); }
}
function offerHTML(){ return `<div class="notice" id="offer"><p><strong>These questions are pitched at a high level, and the last few have not gone in.</strong> That is expected: the harder material comes first here. You can skip the remaining ${run.offer.remaining} question${run.offer.remaining > 1 ? "s" : ""} at this level and move on to the next. Skipped questions are recorded as skipped, not as wrong.</p><div class="row"><button id="doDrop">Skip to the next level</button><button class="quiet" id="noDrop">Keep going</button></div></div>`; }
function showOffer(){
  if($("#offer")) $("#offer").remove();
  app.querySelector(".topbar").insertAdjacentHTML("afterend", offerHTML());
  $("#doDrop").addEventListener("click", () => dropTier(run.offer.tier));
  $("#noDrop").addEventListener("click", () => { run.offer = null; $("#offer").remove(); });
  $("#offer").scrollIntoView({block:"nearest"});
}
function dropTier(tier){
  const rest = run.plan.filter(p => p.tier === tier && !run.answers[p.item.id]);
  run.skipped.push(...rest); run.plan = run.plan.filter(p => !rest.includes(p));
  const first = run.plan.findIndex(p => !run.answers[p.item.id]);
  run.page = first < 0 ? Math.max(0, Math.ceil(run.plan.length / run.pageSize) - 1) : Math.floor(first / run.pageSize);
  run.offer = null; persist(); renderPage(); window.scrollTo(0, 0);
}

function renderPage(){
  app.className = "";
  const {plan, pageSize, c} = run;
  const pages = Math.max(1, Math.ceil(plan.length / pageSize));
  run.page = Math.min(run.page, pages - 1);
  const page = run.page, slice = plan.slice(page * pageSize, (page + 1) * pageSize);
  const answered = plan.filter(p => run.answers[p.item.id]).length;
  const items = slice.map(p => {
    const it = p.item, a = run.answers[it.id] || {}, idx = plan.indexOf(p) + 1;
    const figOpts = p.opts.some(o => o.fig);
    return `<section class="item" data-id="${it.id}" data-tier="${p.tier}">
      <div class="num">Question ${idx} of ${plan.length}</div>
      <p class="stem">${tex(p.variant === "tech" ? it.tech : it.plain)}</p>
      ${it.fig ? plotSVG(it.fig) : ""}
      <div class="opts ${figOpts ? "figs" : ""}" role="radiogroup">
        ${p.opts.map((o, i) => { const v = o.idk ? "idk" : i, chk = String(a.choice) === String(v) ? "checked" : "";
          return `<label class="opt ${o.fig ? "fig" : ""} ${o.idk ? "idk" : ""}">${o.fig ? plotSVG(o.fig, true) + `<span class="caption"><input type="radio" name="q-${it.id}" value="${v}" ${chk}> Graph ${"ABCDEF"[i]}</span>` : `<input type="radio" name="q-${it.id}" value="${v}" ${chk}><span>${tex(o.t)}</span>`}</label>`; }).join("")}
      </div>
      ${c.conf ? `<div class="conf">How sure are you? ${["Sure", "Fairly sure", "Guessing"].map(l => `<button type="button" data-conf="${l}" class="${a.conf === l ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}
    </section>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><div><strong>${esc(c.label || "Maths readiness check")}</strong><div class="progress" aria-hidden="true"><div style="width:${answered / plan.length * 100}%"></div></div></div>
    <div class="timer" id="timer"></div></div>
  ${items}
  <div class="nav">
    <div>${page > 0 && (c.allowBack || pageSize === plan.length) ? `<button class="quiet" id="prev">Back</button>` : ""}</div>
    <div>${page < pages - 1 ? `<button id="next">Next</button>` : `<button id="finish">Finish</button>`}</div>
  </div>`;
  if(c.timer) tickTimer();
  app.querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", e => {
    const id = e.target.name.slice(2), now = Date.now();
    const prev = run.answers[id] || {};
    run.answers[id] = {choice:e.target.value === "idk" ? "idk" : +e.target.value, conf:prev.conf, seconds:prev.seconds ?? Math.round((now - run.lastEvent) / 1000)};
    run.lastEvent = now; persist();
    const bar = app.querySelector(".progress div"); if(bar) bar.style.width = (plan.filter(p => run.answers[p.item.id]).length / plan.length * 100) + "%";
    checkDrop(+e.target.closest(".item").dataset.tier);
  }));
  app.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = b.closest(".item").dataset.id; run.answers[id] = {...(run.answers[id] || {}), conf:b.dataset.conf};
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); persist();
  }));
  if(run.offer) showOffer();
  if($("#prev")) $("#prev").addEventListener("click", () => { run.page--; run.offer = null; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#next")) $("#next").addEventListener("click", () => { run.page++; run.offer = null; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#finish")) $("#finish").addEventListener("click", () => {
    const left = plan.length - plan.filter(p => run.answers[p.item.id]).length;
    if(left && !confirm(`You have ${left} unanswered question${left > 1 ? "s" : ""}. Finish anyway? Unanswered questions are recorded as not attempted.`)) return;
    finishRun();
  });
}

function finishRun(){
  if(run.finished) return; run.finished = true; clearInterval(run.tick);
  localStorage.removeItem("dewmath2:" + run.code);
  const c = run.c;
  const r = buildResult({plan:run.plan, skipped:run.skipped, cfg:c, answers:run.answers, code:run.code, ident:run.ident, vm:run.vm, elapsed:Math.round((Date.now() - run.started) / 1000), timedOut:run.timedOut});
  const safe = (r.student.identity || "anonymous").replace(/[^\w\-]+/g, "_").slice(0, 30);
  const fname = `dewmath-${safe}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  const href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 1)], {type:"application/json"}));
  const list = c.showItems ? `<h2>Question by question</h2><ul class="result-list">${r.items.filter(i => !i.skipped).map((i, k) => {
    const p = run.plan[k]; const mark = !i.answered ? ["skip", "–", "Not attempted"] : i.choice === "I don't know" ? ["skip", "?", "I don't know"] : i.correct ? ["ok", "✓", "Correct"] : ["no", "✗", "Not this time"];
    const ans = c.showAnswers && !i.correct ? `<small>Correct answer: ${p.opts.find(o => o.ok).fig ? "Graph " + "ABCDEF"[p.opts.findIndex(o => o.ok)] : tex(p.opts.find(o => o.ok).t)}</small>` : "";
    return `<li><span class="mark ${mark[0]}">${mark[1]}</span><span>${tex(p.variant === "tech" ? p.item.tech : p.item.plain)}<br><small>${esc(skillById[i.skill].name)}</small></span><span>${mark[2]}<br>${ans}</span></li>`; }).join("")}</ul>` : "";
  app.innerHTML = `
  <h1>Finished</h1>
  ${run.timedOut ? `<p class="notice">The time ran out, so this is what you had answered by then.</p>` : ""}
  <p class="lead">Thank you. Download your results file now and send it to your teacher in the way they asked.</p>
  <p><a class="btn" id="dl" href="${href}" download="${fname}">Download my results file</a></p>
  <p class="muted">The file is called <span class="code">${esc(fname)}</span>. It records your answers and nothing else. It does not leave this device until you send it.</p>
  ${c.showScore ? `<h2>Your score</h2><p class="lead">${r.summary.correct} out of ${r.summary.total}${r.summary.answered < r.summary.total ? ` (${r.summary.total - r.summary.answered} not attempted)` : ""}${r.summary.skipped ? `, with ${r.summary.skipped} skipped` : ""}</p><p>A low score on some topics is the useful outcome here: it tells your teacher where to start.</p>` : ""}
  ${list}`;
  window.scrollTo(0, 0);
}

/* Small SVG chart helpers */
function hbars(rows, opts){
  const o = {max:1, fmt:v => Math.round(v * 100) + "%", w:640, rowH:22, labelW:230, ...opts};
  const h = rows.length * o.rowH + 6, bw = o.w - o.labelW - 60;
  let s = `<svg viewBox="0 0 ${o.w} ${h}" class="chart" role="img" aria-label="${esc(o.label || "bar chart")}">`;
  rows.forEach((r, i) => {
    const y = i * o.rowH + 3, len = Math.max(0, Math.min(1, r.value / o.max)) * bw;
    s += `<text x="${o.labelW - 8}" y="${y + 15}" font-size="12" text-anchor="end" fill="var(--ink)">${esc(r.label)}</text>`;
    s += `<rect x="${o.labelW}" y="${y + 3}" width="${bw}" height="${o.rowH - 8}" fill="var(--rule)" opacity=".5"/>`;
    s += `<rect x="${o.labelW}" y="${y + 3}" width="${len.toFixed(1)}" height="${o.rowH - 8}" fill="${r.color || "var(--accent)"}"/>`;
    const txt = esc(o.fmt(r.value)) + (r.note ? " " + esc(r.note) : "");
    if(len > bw * 0.7) s += `<text x="${o.labelW + len - 6}" y="${y + 15}" font-size="12" text-anchor="end" fill="#fff">${txt}</text>`;
    else s += `<text x="${o.labelW + len + 6}" y="${y + 15}" font-size="12" fill="var(--ink-soft)">${txt}</text>`;
  });
  return s + "</svg>";
}
function vbars(rows, opts){
  const o = {max:null, w:640, h:200, fmt:v => v, label:"chart", ...opts};
  const max = o.max || Math.max(1, ...rows.map(r => r.value)), n = rows.length, pad = 30, bw = (o.w - 2 * pad) / n;
  let s = `<svg viewBox="0 0 ${o.w} ${o.h}" class="chart" role="img" aria-label="${esc(o.label)}">`;
  s += `<line x1="${pad}" y1="${o.h - 30}" x2="${o.w - pad}" y2="${o.h - 30}" stroke="var(--ink-soft)"/>`;
  rows.forEach((r, i) => {
    const bh = (r.value / max) * (o.h - 60), x = pad + i * bw + bw * 0.15, y = o.h - 30 - bh;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bh.toFixed(1)}" fill="${r.color || "var(--accent)"}"/>`;
    s += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(y - 4).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink-soft)">${esc(o.fmt(r.value))}</text>`;
    s += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${o.h - 12}" font-size="11" text-anchor="middle" fill="var(--ink)">${esc(r.label)}</text>`;
  });
  return s + "</svg>";
}
const TOPIC_COLORS = {num:"#2A6F8F", ind:"#3B7A57", alg:"#8A6D1F", eqn:"#7A4E8F", gra:"#B4553A", geo:"#4E8F8A", dis:"#5C6B8F", seq:"#8F5C6B", prb:"#6B8F5C", cal:"#8F7A5C"};
const BANDS = {strong:"Strong background", ready:"Ready for the module", core:"Core gaps", foundation:"Foundation support"};
const BAND_COLORS = {strong:"var(--good)", ready:"var(--accent)", core:"var(--warn)", foundation:"var(--bad)"};

/* Percentages count attempted items only, so a student who ran out of time is not marked down for what they never saw. */
function attempted(S){ return S ? S.total - (S.unanswered || 0) : 0; }
function tierPct(r, t){ const T = (r.summary.tiers || {})[t]; return T && attempted(T) ? T.correct / attempted(T) : null; }
function bandOf(r){
  const p1 = tierPct(r, 1), p2 = tierPct(r, 2), p3 = tierPct(r, 3);
  if(p1 !== null && p1 < 0.7) return "foundation";
  if(p3 !== null && p3 >= 0.65 && (p2 === null || p2 >= 0.75)) return "strong";
  if(p2 === null || p2 >= 0.5) return "ready";
  return "core";
}
/* Older (format 1) files have no tier summary; rebuild one from the bank. */
function upgrade(r){
  if(r.summary.tiers) return r;
  const tiers = {};
  r.items.forEach(i => { const t = (skillById[i.skill] || {}).tier || 2; i.tier = t; tiers[t] = tiers[t] || {total:0, correct:0, idk:0, unanswered:0, skipped:0}; tiers[t].total++; if(i.correct) tiers[t].correct++; if(i.choice === "I don't know") tiers[t].idk++; if(!i.answered) tiers[t].unanswered++; });
  r.summary.tiers = tiers; r.summary.idk = r.items.filter(i => i.choice === "I don't know").length; r.summary.skipped = 0;
  Object.values(r.summary.skills).forEach(S => { S.tier = S.tier || 2; S.skipped = 0; });
  return r;
}

function renderReport(results){
  if(!results.length) return;
  results = results.map(upgrade);
  const names = results.map((r, i) => r.student.identity || `Student ${i + 1}`);
  const skillIds = [...new Set(results.flatMap(r => Object.keys(r.summary.skills)))].sort((a, b) => SKILLS.findIndex(s => s.id === a) - SKILLS.findIndex(s => s.id === b));
  const skillName = id => (skillById[id] || {}).name || results.find(r => r.dictionary.skills[id])?.dictionary.skills[id] || id;
  const skillTier = id => (skillById[id] || {}).tier || results.find(r => r.summary.skills[id])?.summary.skills[id].tier || 2;
  const skillTopic = id => (skillById[id] || {}).topic || results.find(r => r.summary.skills[id])?.summary.skills[id].topic || "num";
  const errName = e => ERRORS[e] || results.find(r => r.dictionary.errors[e])?.dictionary.errors[e] || e;
  const pctOf = S => S && attempted(S) ? S.correct / attempted(S) : null;
  const flagged = S => S && attempted(S) && S.correct / attempted(S) < 0.5;
  const watch = S => S && attempted(S) && S.correct / attempted(S) === 0.5;
  const meanOf = id => { const Ss = results.map(r => r.summary.skills[id]).filter(S => S && attempted(S)); return Ss.length ? Ss.reduce((a, S) => a + pctOf(S), 0) / Ss.length : null; };
  const cell = p => p === null ? `<td class="c muted">–</td>` : `<td class="c" style="background:${p < .5 ? "var(--bad-wash)" : p === .5 ? "var(--warn-wash)" : p < 1 ? "var(--wash)" : "var(--good-wash)"}">${Math.round(p * 100)}</td>`;
  const bands = results.map(bandOf);
  const scores = results.map(r => r.summary.total ? r.summary.correct / r.summary.total : 0);
  const anyConf = results.some(r => r.items.some(i => i.confidence));
  const anyMixed = results.some(r => r.config.language === "mixed");

  /* overview */
  const meanScore = scores.reduce((a, b) => a + b, 0) / scores.length;
  const bins = [0,0,0,0,0]; scores.forEach(s => bins[Math.min(4, Math.floor(s * 5))]++);
  const hist = vbars(["0–19%","20–39%","40–59%","60–79%","80–100%"].map((l, i) => ({label:l, value:bins[i]})), {h:170, label:"Score distribution", fmt:v => v ? v : ""});
  const bandCounts = Object.keys(BANDS).map(b => ({label:BANDS[b], value:bands.filter(x => x === b).length, color:BAND_COLORS[b]}));

  /* priorities */
  const flagCounts = skillIds.map(id => ({id, n:results.filter(r => flagged(r.summary.skills[id])).length, tier:skillTier(id)})).filter(x => x.n > 0);
  const priorities = flagCounts.filter(x => x.tier < 3).sort((a, b) => a.tier - b.tier || b.n - a.n || meanOf(a.id) - meanOf(b.id)).slice(0, 6);
  const stretch = flagCounts.filter(x => x.tier === 3).sort((a, b) => b.n - a.n || meanOf(a.id) - meanOf(b.id)).slice(0, 4);

  /* by tier and by topic */
  const tierRows = [1,2,3].map(t => { const ps = results.map(r => tierPct(r, t)).filter(p => p !== null); return {label:`${TIERS[t]} (${ps.length} students)`, value:ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0}; });
  const topicRows = TOPICS.map(t => { const ids = skillIds.filter(id => skillTopic(id) === t.id); if(!ids.length) return null; const ms = ids.map(meanOf).filter(m => m !== null); return {label:t.name, value:ms.reduce((a, b) => a + b, 0) / ms.length, color:TOPIC_COLORS[t.id]}; }).filter(Boolean).sort((a, b) => a.value - b.value);

  /* by skill */
  const skillRows = skillIds.map(id => {
    const Ss = results.map(r => r.summary.skills[id]).filter(S => S && attempted(S));
    const errs = {}; Ss.forEach(S => S.errors.forEach(e => errs[e] = (errs[e] || 0) + 1));
    const top = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e, n]) => `<span class="tag">${esc(errName(e))} (${n})</span>`).join(" ");
    return `<tr><td>${esc(skillName(id))}<br><small class="tier t${skillTier(id)}">${TIERS[skillTier(id)]}</small> <small>${esc((topicById[skillTopic(id)] || {}).name || "")}</small></td><td class="c">${Ss.length}</td>${cell(meanOf(id))}<td class="c">${Ss.filter(flagged).length}${Ss.filter(watch).length ? ` <small>(+${Ss.filter(watch).length})</small>` : ""}</td><td class="c">${Ss.reduce((a, S) => a + S.idk, 0)}</td><td>${top || "<span class='muted'>none recorded</span>"}</td></tr>`;
  }).join("");
  const skillChart = hbars(skillIds.map(id => ({label:skillName(id), value:meanOf(id) || 0, color:TOPIC_COLORS[skillTopic(id)]})).sort((a, b) => a.value - b.value), {rowH:20, label:"Mean percent correct by skill, lowest first"});

  /* errors */
  const errAll = {}; results.forEach(r => r.items.forEach(i => { if(i.error) errAll[i.error] = (errAll[i.error] || 0) + 1; }));
  const errRows = Object.entries(errAll).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([e, n]) => ({label:errName(e).length > 60 ? errName(e).slice(0, 58) + "…" : errName(e), value:n}));
  const errChart = errRows.length ? hbars(errRows, {max:Math.max(...errRows.map(r => r.value)), fmt:v => v + (v === 1 ? " student-item" : " student-items"), labelW:380, w:700, rowH:20, label:"Most frequent tagged errors"}) : "<p class='muted'>No tagged errors yet.</p>";

  /* confidence */
  let confBlock = "";
  if(anyConf){
    const M = {}; ["Sure", "Fairly sure", "Guessing"].forEach(c => M[c] = {right:0, wrong:0, idk:0});
    results.forEach(r => r.items.forEach(i => { if(!i.confidence || !i.answered) return; const m = M[i.confidence] || (M[i.confidence] = {right:0, wrong:0, idk:0}); if(i.choice === "I don't know") m.idk++; else if(i.correct) m.right++; else m.wrong++; }));
    const cw = results.map((r, i) => ({name:names[i], n:r.items.filter(it => it.confidence === "Sure" && it.answered && it.correct === false && it.choice !== "I don't know").length})).sort((a, b) => b.n - a.n);
    confBlock = `<h2>Confidence against correctness</h2>
    <p class="muted">A confident wrong answer is a held misconception rather than a gap, and it is the first thing to teach against. Answers marked "Sure" that were wrong are counted below.</p>
    <div class="grid2"><div class="scroll"><table><thead><tr><th>Student said</th><th>Right</th><th>Wrong</th><th>Don't know</th><th>Accuracy</th></tr></thead><tbody>
    ${Object.entries(M).map(([c, m]) => `<tr><td>${esc(c)}</td><td class="c">${m.right}</td><td class="c">${m.wrong}</td><td class="c">${m.idk}</td>${cell(m.right + m.wrong ? m.right / (m.right + m.wrong) : null)}</tr>`).join("")}</tbody></table></div>
    <div>${hbars(cw.slice(0, 12).map(x => ({label:x.name, value:x.n, color:"var(--bad)"})), {max:Math.max(1, ...cw.map(x => x.n)), fmt:v => v + " confident wrong", labelW:120, w:520, rowH:20, label:"Confident wrong answers by student"})}</div></div>`;
  }

  /* language */
  let langBlock = "";
  if(anyMixed){
    const per = results.map((r, i) => { const P = r.items.filter(it => it.answered && it.variant === "plain"), T = r.items.filter(it => it.answered && it.variant === "tech"); return {name:names[i], plain:P.length ? P.filter(x => x.correct).length / P.length : null, tech:T.length ? T.filter(x => x.correct).length / T.length : null}; });
    const gap = per.filter(x => x.plain !== null && x.tech !== null).map(x => ({...x, gap:x.plain - x.tech})).sort((a, b) => b.gap - a.gap);
    langBlock = `<h2>Everyday against mathematical wording</h2>
    <p class="muted">Where a student does much better on the everyday wording of the same kind of question, the gap is vocabulary rather than mathematics. The two halves of each student's sitting are different questions, so treat gaps under 15 points as noise.</p>
    <div class="scroll"><table><thead><tr><th>Student</th><th>Everyday wording</th><th>Mathematical wording</th><th>Gap</th></tr></thead><tbody>
    ${gap.map(x => `<tr><td>${esc(x.name)}</td>${cell(x.plain)}${cell(x.tech)}<td class="c" style="${x.gap >= .15 ? "color:var(--bad);font-weight:700" : ""}">${Math.round(x.gap * 100) > 0 ? "+" : ""}${Math.round(x.gap * 100)}</td></tr>`).join("")}</tbody></table></div>`;
  }

  /* time */
  const timeRows = [1,2,3].map(t => { const ss = results.flatMap(r => r.items.filter(i => i.tier === t && i.seconds)).map(i => i.seconds); return ss.length ? {label:TIERS[t], value:ss.reduce((a, b) => a + b, 0) / ss.length} : null; }).filter(Boolean);

  /* by student */
  const studentRows = results.map((r, i) => {
    const fl = [1,2,3].map(t => skillIds.filter(id => skillTier(id) === t && flagged(r.summary.skills[id])).length);
    return `<tr><td>${esc(names[i])}</td><td><span class="band" style="color:${BAND_COLORS[bands[i]]}">${BANDS[bands[i]]}</span></td><td class="c">${r.summary.correct}/${r.summary.total}</td>${cell(tierPct(r, 1))}${cell(tierPct(r, 2))}${cell(tierPct(r, 3))}<td class="c">${r.summary.idk || 0}</td><td class="c">${Math.round(r.elapsedSeconds / 60)} min${r.timedOut ? " (timed out)" : ""}</td><td class="c">${fl[0]}</td><td class="c">${fl[1]}</td><td class="c">${fl[2]}</td></tr>`;
  }).join("");

  const cards = results.map((r, i) => {
    const fl = [1,2,3].map(t => skillIds.filter(id => skillTier(id) === t && flagged(r.summary.skills[id])));
    const errs = {}; r.items.forEach(it => { if(it.error) errs[it.error] = (errs[it.error] || 0) + 1; });
    const topErr = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const cw = r.items.filter(it => it.confidence === "Sure" && it.answered && it.correct === false && it.choice !== "I don't know");
    const wt = skillIds.filter(id => skillTier(id) < 3 && watch(r.summary.skills[id]));
    const lst = a => a.map(skillName).join(", ");
    const start = fl[0].length ? `Start with the foundation gaps: ${lst(fl[0])}.${fl[1].length ? ` Core gaps to follow: ${lst(fl[1])}.` : ""}` : fl[1].length ? `Foundations are secure. Start with: ${lst(fl[1])}.` : fl[2].length ? `Core is secure. Stretch material is where the gaps are: ${lst(fl[2])}.` : "No skill was flagged. This student can be given extension work from the start.";
    const adv = fl[0].length || fl[1].length ? (fl[2].length ? ` Advanced skills flagged: ${fl[2].length} of ${skillIds.filter(id => skillTier(id) === 3).length}.` : "") : "";
    return `<details class="card"><summary><strong>${esc(names[i])}</strong> <span class="band" style="color:${BAND_COLORS[bands[i]]}">${BANDS[bands[i]]}</span> <small>${r.summary.correct}/${r.summary.total}${r.summary.skipped ? `, ${r.summary.skipped} skipped` : ""}${r.timedOut ? ", timed out" : ""}</small></summary>
      <p>${esc(start + adv)}</p>
      ${wt.length ? `<p class="muted">Worth checking (half right): ${esc(wt.map(skillName).join(", "))}.</p>` : ""}
      ${hbars([1,2,3].map(t => ({label:TIERS[t], value:tierPct(r, t) ?? 0, note:tierPct(r, t) === null ? "(not asked)" : ""})), {labelW:110, w:420, rowH:20, label:"Percent correct by level"})}
      ${topErr.length ? `<p><strong>Most repeated errors</strong><br>${topErr.map(([e, n]) => `<span class="tag">${esc(errName(e))} (${n})</span>`).join(" ")}</p>` : ""}
      ${cw.length ? `<p><strong>Confident wrong answers</strong> (${cw.length}): ${cw.map(it => esc(skillName(it.skill))).join(", ")}</p>` : ""}
      ${r.summary.idk ? `<p>Said "I don't know" ${r.summary.idk} time${r.summary.idk > 1 ? "s" : ""}.</p>` : ""}
    </details>`;
  }).join("");

  const heat = `<div class="scroll"><table class="heat"><thead><tr><th></th>${skillIds.map(id => `<th class="rot">${esc(skillName(id))}</th>`).join("")}</tr></thead><tbody>${results.map((r, i) => `<tr><td>${esc(names[i])}</td>${skillIds.map(id => cell(pctOf(r.summary.skills[id]))).join("")}</tr>`).join("")}</tbody></table></div>`;

  $("#out").innerHTML = `
  <h2>${results.length} result${results.length > 1 ? "s" : ""}: mean score ${Math.round(meanScore * 100)}%</h2>
  ${priorities.length ? `<div class="notice good"><strong>Where to start:</strong> ${priorities.map(p => `${esc(skillName(p.id))} (${p.n} of ${results.length})`).join("; ")}.</div>` : `<div class="notice good">No foundation or core skill is flagged for any student.</div>`}
  ${stretch.length ? `<p class="muted"><strong>Advanced material most often missed</strong> (expected at this stage): ${stretch.map(p => `${esc(skillName(p.id))} (${p.n})`).join("; ")}.</p>` : ""}
  <div class="grid2">
    <div><h3>Score distribution</h3>${hist}</div>
    <div><h3>Readiness bands</h3>${hbars(bandCounts, {max:results.length, fmt:v => v + " student" + (v === 1 ? "" : "s"), labelW:190, w:520, label:"Students per band"})}</div>
  </div>
  <details><summary>How the diagnostic criteria are worked out</summary>
    <p>A skill is <strong>flagged</strong> for a student when they got fewer than half of its attempted items right (both wrong, with two items), with "I don't know" counted as a miss and unattempted items (time ran out) left out. Exactly half right is shown in amber as <strong>worth checking</strong> and counted in brackets. With two or three items per skill a flag is a prompt to look closer, not a verdict.</p>
    <p><strong>Readiness bands</strong> use the percent correct at each level. <em>Foundation support</em>: below 70% on foundation items. Otherwise <em>Strong background</em>: at least 65% on advanced items and at least 75% on core. Otherwise <em>Ready for the module</em>: at least 50% on core. Otherwise <em>Core gaps</em>. A level that was not asked is ignored.</p>
    <p><strong>Where to start</strong> lists foundation and core skills only, foundation first, then by how many students are flagged, then by the class mean; advanced material is reported separately because gaps there are expected before the module. A <strong>confident wrong</strong> answer is one marked "Sure" that was wrong and was not "I don't know".</p>
  </details>

  <div class="grid2">
    <div><h3>By level</h3>${hbars(tierRows, {labelW:200, w:520, label:"Mean percent correct by level"})}</div>
    <div><h3>By topic, weakest first</h3>${hbars(topicRows, {labelW:230, w:520, label:"Mean percent correct by topic"})}</div>
  </div>

  <h2>By skill</h2>
  ${skillChart}
  <div class="scroll"><table><thead><tr><th>Skill</th><th>Students</th><th>Mean %</th><th>Flagged</th><th>Don't know</th><th>Most common errors</th></tr></thead><tbody>${skillRows}</tbody></table></div>

  <h2>Most frequent errors across the class</h2>
  <p class="muted">Each count is one student giving that tagged wrong answer once. The same student can appear more than once for the same tag.</p>
  ${errChart}

  ${confBlock}
  ${langBlock}

  <h2>Time spent</h2>
  <div class="grid2"><div>${hbars(timeRows, {max:Math.max(1, ...timeRows.map(r => r.value)), fmt:v => Math.round(v) + " s per question", labelW:110, w:420, label:"Mean seconds per question by level"})}</div>
  <div>${hbars(results.map((r, i) => ({label:names[i], value:r.elapsedSeconds / 60, color:r.timedOut ? "var(--bad)" : "var(--accent)"})).sort((a, b) => b.value - a.value), {max:Math.max(1, ...results.map(r => r.elapsedSeconds / 60)), fmt:v => Math.round(v) + " min", labelW:120, w:420, rowH:18, label:"Total time by student"})}</div></div>

  <h2>By student</h2>
  <div class="scroll"><table><thead><tr><th>Student</th><th>Band</th><th>Score</th><th>Foundation %</th><th>Core %</th><th>Advanced %</th><th>Don't know</th><th>Time</th><th>Foundation flags</th><th>Core flags</th><th>Advanced flags</th></tr></thead><tbody>${studentRows}</tbody></table></div>

  <h2>Individual report cards</h2>
  ${cards}

  <h2>Percent correct, student by skill</h2>
  ${heat}
  <p><button class="quiet" id="csv">Download this grid as CSV</button> <button class="quiet" id="csv2">Download the student summary as CSV</button></p>`;
  $("#csv").addEventListener("click", () => {
    const rows = [["student", "band", ...skillIds.map(skillName)], ...results.map((r, i) => [names[i], BANDS[bands[i]], ...skillIds.map(id => { const p = pctOf(r.summary.skills[id]); return p === null ? "" : Math.round(p * 100); })])];
    downloadCSV(rows, "dewmath-class-skills.csv");
  });
  $("#csv2").addEventListener("click", () => {
    const rows = [["student", "band", "correct", "total", "foundation %", "core %", "advanced %", "dont know", "skipped", "minutes", "timed out", "flagged skills"],
      ...results.map((r, i) => [names[i], BANDS[bands[i]], r.summary.correct, r.summary.total, ...[1,2,3].map(t => { const p = tierPct(r, t); return p === null ? "" : Math.round(p * 100); }), r.summary.idk || 0, r.summary.skipped || 0, Math.round(r.elapsedSeconds / 60), r.timedOut ? "yes" : "no", skillIds.filter(id => flagged(r.summary.skills[id])).map(skillName).join("; ")])];
    downloadCSV(rows, "dewmath-class-students.csv");
  });
}
function downloadCSV(rows, name){
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name; a.click();
}

if(typeof window !== "undefined" && app){ window.addEventListener("hashchange", route); route(); }
</script>
</body>
</html>
