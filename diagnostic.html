<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
@font-face{font-family:"OpenDyslexic";src:url("fonts/OpenDyslexic-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url("fonts/OpenDyslexic-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url("fonts/OpenDyslexic-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

/* ---- palettes: navy and burnt orange (default), slate and teal ---- */
:root{
  --paper:#F8F5EF; --ink:#14213D; --ink-soft:#4A5570; --rule:#D8D3C8; --field:#FFFFFF;
  --accent:#B85C1C; --accent-ink:#FFFFFF; --wash:#F2E6D8;
  --good:#2E6B4F; --bad:#9E2B25; --warn:#8A6D1F; --good-wash:#E3EEE6; --bad-wash:#F4E1DD; --warn-wash:#F3ECD6;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-dys:"OpenDyslexic","Atkinson Hyperlegible",system-ui,sans-serif;
  --font:var(--font-serif); --lh:1.6; --col:44rem; --col-wide:72rem;
}
:root[data-palette="slate"]{
  --paper:#F7F8F6; --ink:#1E2A32; --ink-soft:#4A5860; --rule:#D5DBDD; --field:#FFFFFF;
  --accent:#2A6F8F; --accent-ink:#FFFFFF; --wash:#E8F0F4;
  --good:#3B7A57; --bad:#B4553A; --warn:#8A6D1F; --good-wash:#E6F0EA; --bad-wash:#F5E6E1; --warn-wash:#F3ECD6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A2E; --ink:#EDE7DC; --ink-soft:#B3AC9F; --rule:#2C3A55; --field:#172540;
    --accent:#E38A4A; --accent-ink:#14213D; --wash:#22314F;
    --good:#7FC29B; --bad:#E48A7A; --warn:#D9B85E; --good-wash:#1E3529; --bad-wash:#3E2622; --warn-wash:#3A3320;
  }
  :root:not([data-theme="light"])[data-palette="slate"]{
    --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B; --field:#1F262B;
    --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
    --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620; --warn-wash:#3A3320;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A2E; --ink:#EDE7DC; --ink-soft:#B3AC9F; --rule:#2C3A55; --field:#172540;
  --accent:#E38A4A; --accent-ink:#14213D; --wash:#22314F;
  --good:#7FC29B; --bad:#E48A7A; --warn:#D9B85E; --good-wash:#1E3529; --bad-wash:#3E2622; --warn-wash:#3A3320;
}
:root[data-theme="dark"][data-palette="slate"]{
  --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B; --field:#1F262B;
  --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
  --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620; --warn-wash:#3A3320;
}
/* ---- type, size, width ---- */
:root[data-font="sans"]{--font:var(--font-sans);--lh:1.55}
:root[data-font="dyslexic"]{--font:var(--font-dys);--lh:1.75}
html{font-size:17px}
:root[data-size="small"]{font-size:15px}
:root[data-size="large"]{font-size:19.5px}
:root[data-width="narrow"]{--col:36rem;--col-wide:56rem}
:root[data-width="wide"]{--col:58rem;--col-wide:92rem}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:var(--lh)}
:root[data-font="dyslexic"] body{word-spacing:.06em}
main{max-width:var(--col);margin:0 auto;padding:2.5rem 1.25rem 5rem}
main.wide{max-width:var(--col-wide)}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .75rem;font-weight:700}
h2{font-size:1.3rem;margin:2.25rem 0 .75rem;font-weight:700}
h3{font-size:1.05rem;margin:1.5rem 0 .5rem;font-weight:700}
p{margin:0 0 1rem}
p.lead{font-size:1.12rem;color:var(--ink-soft)}
a{color:var(--accent)}
small,.muted{color:var(--ink-soft)}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
button,.btn{font:inherit;font-size:1rem;padding:.6rem 1.1rem;border-radius:.4rem;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
button.quiet,.btn.quiet{background:transparent;color:var(--accent)}
button.small{padding:.3rem .7rem;font-size:.9rem}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.opt:focus-within,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
input[type=text],input[type=url],input[type=number],select,textarea{font:inherit;font-size:1rem;padding:.5rem .65rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);color:var(--ink);max-width:100%}
input[type=text],input[type=url]{text-overflow:ellipsis}
button.copied{background:var(--good)!important;border-color:var(--good)!important;color:#fff!important}
button.quiet.copied{color:var(--good)!important;background:transparent!important}
input[type=text],input[type=url],textarea{width:100%}
label.check{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
label.check input[type=checkbox],label.check input[type=radio]{margin-top:.25rem;width:1.3rem;height:1.3rem;flex:none;accent-color:var(--accent)}
label.check.skill{padding:.45rem 0;border-bottom:1px solid var(--rule)}
label.check.skill:last-child{border-bottom:0}
label.check.skill .ex{display:block;color:var(--ink-soft);font-size:.9rem;margin-top:.1rem}
label.check.topic{padding:.5rem 0 .2rem}
details.level{border:1px solid var(--rule);border-radius:.6rem;padding:.4rem 1rem .6rem;margin:0 0 1rem}
details.level>summary{font-weight:700;font-size:1.1rem;padding:.4rem 0;list-style-position:outside}
details.level>summary small{font-weight:400;color:var(--ink-soft);font-size:.9rem}
details.level .desc{margin:.2rem 0 .6rem;color:var(--ink-soft)}
.topic-block{margin:.4rem 0 .8rem;padding-left:.2rem}
.topic-block .skills{padding-left:1.9rem}
button.quiet.active{background:var(--accent);color:var(--accent-ink)}
.stickybar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:.6rem 0;margin-top:2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;z-index:2}
.encourage{margin:.6rem 0 0;padding:.6rem .9rem;background:var(--good-wash);border-left:4px solid var(--good);border-radius:0 .4rem .4rem 0;font-size:1rem}
.opt.idk{color:var(--ink-soft);font-size:1rem}
.tabs{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:2px solid var(--rule);margin:1rem 0 1.5rem;position:sticky;top:0;background:var(--paper);z-index:3;padding-top:.4rem}
.tabs button{background:transparent;color:var(--ink-soft);border:0;border-bottom:3px solid transparent;border-radius:0;padding:.5rem .8rem;margin-bottom:-2px;font-family:var(--font-sans);font-size:.95rem}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.pane[hidden]{display:none}
.thr{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:.5rem 2rem}
.thr label{display:grid;grid-template-columns:1fr 5.5rem;gap:.75rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.thr input{width:5.5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:.5rem 0 1rem}
.kv dt{font-weight:700}
.kv dd{margin:0}
.margin{color:var(--warn);font-weight:700}
fieldset{border:1px solid var(--rule);border-radius:.5rem;padding:.75rem 1rem 1rem;margin:0 0 1.25rem}
legend{padding:0 .4rem;font-weight:700}
.topic-block{margin:0 0 1rem}
.topic-block .skills{padding-left:1.7rem}
.notice{background:var(--wash);border-left:4px solid var(--accent);padding:.75rem 1rem;border-radius:0 .4rem .4rem 0;margin:1rem 0}
.notice.bad{border-color:var(--bad);background:var(--bad-wash)}
.notice.good{border-color:var(--good);background:var(--good-wash)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.urlbox{display:block;width:100%;padding:.75rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);word-break:break-all;margin:.5rem 0}
.tier{padding:.05rem .4rem;border-radius:.3rem;font-size:.8em;font-family:var(--font-sans)}
.tier.t1{background:var(--wash)} .tier.t2{background:var(--good-wash)} .tier.t3{background:var(--bad-wash)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.5rem;align-items:start}
.chart{width:100%;height:auto;display:block;margin:.25rem 0 1rem;font-family:var(--font-sans)}
.band{font-weight:700}
details.card{border:1px solid var(--rule);border-radius:.5rem;padding:.5rem .9rem;margin:.5rem 0}
details.card[open]{padding-bottom:1rem}
details.card .chart{max-width:420px}
.steps{list-style:none;counter-reset:s;padding:0;margin:1rem 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2rem 1fr;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:counter(s);font-weight:700;color:var(--accent);font-size:1.3rem;line-height:1.2}
/* ---- the sitting ---- */
.topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);padding:.6rem 0;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;z-index:2}
.timer{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.timer.low{color:var(--bad)}
.saved{font-size:.85rem;color:var(--ink-soft);font-family:var(--font-sans)}
.item{padding:1.5rem 0 1.75rem;border-bottom:1px solid var(--rule)}
.item:last-of-type{border-bottom:0}
.item .num{color:var(--ink-soft);margin-bottom:.35rem;font-family:var(--font-sans);font-size:.95rem}
.stem{font-size:1.28rem;line-height:1.45;margin:0 0 1rem}
.stem .katex{font-size:1.02em}
.plot{width:100%;max-width:280px;height:auto;display:block;margin:.5rem 0 1rem;font-family:var(--font-sans)}
.opts{display:grid;gap:.5rem;margin:0}
.opts.figs{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.opts.figs .opt.idk{grid-column:1/-1;justify-content:center}
label.opt{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border:1.5px solid var(--rule);border-radius:.5rem;background:var(--field);cursor:pointer;font-size:1.08rem}
label.opt input{width:1.15rem;height:1.15rem;flex:none;margin:0}
label.opt:has(input:checked){border-color:var(--accent);background:var(--wash)}
label.opt .katex{font-size:1.05em}
label.opt .plot{margin:0;max-width:100%}
label.opt.fig{flex-direction:column;align-items:stretch}
label.opt.fig .plot{max-width:none}
label.opt.fig .caption{display:flex;gap:.6rem;align-items:center}
.opt.idk{color:var(--ink-soft)}
.conf{margin-top:.75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--ink-soft)}
.conf button{padding:.3rem .7rem;font-size:.92rem;border-color:var(--rule);background:transparent;color:var(--ink)}
.conf button.on{border-color:var(--accent);background:var(--wash)}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:.4rem}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.result-list{list-style:none;padding:0;margin:0}
.result-list li{padding:.6rem 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1.6rem 1fr auto;gap:.6rem;align-items:baseline}
.mark{font-weight:700}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}.mark.skip{color:var(--ink-soft)}
/* ---- analysis ---- */
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.5rem 0 1.5rem}
th,td{text-align:left;padding:.45rem .55rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700}
.scroll{overflow-x:auto}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:2.6rem}
.heat th.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:400;white-space:nowrap;padding:.3rem;font-family:var(--font-sans);font-size:.85rem}
td.c{text-align:center}
.tag{display:inline-block;padding:.1rem .45rem;border-radius:.3rem;background:var(--wash);font-size:.9em;margin:.1rem .2rem .1rem 0}
.errlist{list-style:none;padding:0;margin:.5rem 0}
.errlist li{padding:.5rem 0;border-bottom:1px solid var(--rule)}
.errlist li:last-child{border-bottom:0}
.errlist .n{font-family:var(--font-sans);font-size:.85rem;color:var(--ink-soft);font-weight:400}
.errlist small{color:var(--ink-soft)}
details{margin:.5rem 0}
summary{cursor:pointer}
/* ---- display settings ---- */
.prefs-toggle{position:fixed;top:.6rem;right:.6rem;z-index:5;padding:.35rem .7rem;font-size:.85rem;font-family:var(--font-sans);border-color:var(--rule);background:var(--paper);color:var(--ink-soft)}
.prefs{position:fixed;top:2.9rem;right:.6rem;z-index:5;width:min(20rem,calc(100vw - 1.2rem));background:var(--field);border:1px solid var(--rule);border-radius:.6rem;padding:1rem;box-shadow:0 8px 24px rgba(0,0,0,.12);font-family:var(--font-sans);font-size:.95rem}
.prefs[hidden]{display:none}
.prefs label{display:grid;grid-template-columns:7.5rem 1fr;gap:.5rem;align-items:center;margin:.4rem 0}
.prefs select{padding:.3rem .5rem;font-size:.92rem}
.prefs .row{margin-top:.6rem;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
@media (max-width:600px){html{font-size:16px} :root[data-size="large"]{font-size:18px} main{padding:3rem 1rem 4rem} .stem{font-size:1.15rem} .prefs label{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="prefs-toggle" id="prefsToggle" aria-expanded="false" aria-controls="prefs">Display</button>
<div class="prefs" id="prefs" hidden>
  <strong>Display settings</strong>
  <label>Appearance <select data-pref="theme"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Colours <select data-pref="palette"><option value="">Navy and burnt orange</option><option value="slate">Slate and teal</option></select></label>
  <label>Font <select data-pref="font"><option value="">Serif</option><option value="sans">Sans-serif</option><option value="dyslexic">OpenDyslexic</option></select></label>
  <label>Text size <select data-pref="size"><option value="small">Smaller</option><option value="">Normal</option><option value="large">Larger</option></select></label>
  <label>Column width <select data-pref="width"><option value="narrow">Narrow</option><option value="">Normal</option><option value="wide">Wide</option></select></label>
  <div class="row"><small>Saved on this device only.</small><button class="quiet small" id="prefsReset">Reset</button></div>
</div>
<main id="app"></main>
<script>
/* ---- display settings, shared by every dewmath page ---- */
(function(){
  const KEY = "dewmath:display", h = document.documentElement, panel = document.getElementById("prefs"), toggle = document.getElementById("prefsToggle");
  if(!panel) return;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } };
  const apply = p => { ["theme","palette","font","size","width"].forEach(k => { if(p[k]) h.setAttribute("data-" + k, p[k]); else h.removeAttribute("data-" + k); }); panel.querySelectorAll("[data-pref]").forEach(s => s.value = p[s.dataset.pref] || ""); };
  apply(load());
  panel.querySelectorAll("[data-pref]").forEach(s => s.addEventListener("change", () => { const p = load(); if(s.value) p[s.dataset.pref] = s.value; else delete p[s.dataset.pref]; try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} apply(p); }));
  document.getElementById("prefsReset").addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch(e){} apply({}); });
  toggle.addEventListener("click", () => { const open = panel.hidden; panel.hidden = !open; toggle.setAttribute("aria-expanded", String(open)); });
  document.addEventListener("click", e => { if(!panel.hidden && !panel.contains(e.target) && e.target !== toggle){ panel.hidden = true; toggle.setAttribute("aria-expanded", "false"); } });
})();
/* ==========================================================================
   ITEM BANK (v2)
   To add an item, append it to ITEMS. To add a skill, append it to SKILLS and
   never reorder: a skill's position is its bit in the share code.

   Skill fields:  id, topic, name, tier (1 foundation, 2 core, 3 advanced), mod ("M", "C" or "MC")
   Item fields:   id, skill, plain, tech, fig?, opts (one ok:1, wrong ones carry e:"tag")
   ========================================================================== */
const BANK_VERSION = "2026-09-18.3";

const TOPICS = [
  {id:"num", name:"Number, fractions and percentages", desc:"Arithmetic with whole numbers, negatives, fractions, decimals, percentages, ratio and estimation."},
  {id:"ind", name:"Indices, roots and logarithms", desc:"Powers and their laws, negative and fractional exponents, square roots, and what a logarithm means."},
  {id:"alg", name:"Algebraic expressions", desc:"Reading notation, collecting terms, substituting, expanding and factorising, and simplifying fractions with letters in them."},
  {id:"eqn", name:"Equations and formulae", desc:"What the equals sign means, solving linear and quadratic equations, rearranging formulae, inequalities and simultaneous equations."},
  {id:"gra", name:"Graphs and functions", desc:"Reading a graph, matching a graph to its equation, slope and intercept, function notation, inverse and composite functions."},
  {id:"geo", name:"Geometry and trigonometry", desc:"Pythagoras, the trigonometric ratios, radians and exact values, distance, midpoint and perpendicular slopes."},
  {id:"dis", name:"Sets, logic and number systems", desc:"Set operations, truth tables and De Morgan's laws, binary and hexadecimal."},
  {id:"seq", name:"Sequences, notation and algorithms", desc:"Sequences and recurrence, sigma and pi notation, matrices, and the behaviour of search and sort algorithms."},
  {id:"prb", name:"Counting, probability and statistics", desc:"Mean and median, factorials and combinations, simple probability, spread and data types."},
  {id:"cal", name:"Limits and differentiation", desc:"What a limit is and the first rules of differentiation."}
];
const TIERS = {1:"Foundation", 2:"Core", 3:"Advanced"};
const TIER_DESC = {
  1:"Skills a student is assumed to bring to Level 5. A gap here needs attention before the module content will make sense.",
  2:"The body of the two modules. These are the skills the modules teach and assess.",
  3:"Material beyond the modules, or from their final sections. These items pick out students with a strong background and most students are expected to miss them."
};

const SKILLS = [
  {id:"num-ord",  topic:"num", name:"Order of operations",                        tier:1, mod:"MC"},
  {id:"num-neg",  topic:"num", name:"Negative numbers",                            tier:1, mod:"MC"},
  {id:"frac-add", topic:"num", name:"Adding fractions", tier:1, mod:"MC"},
  {id:"frac-mul", topic:"num", name:"Multiplying fractions", tier:1, mod:"MC"},
  {id:"frac-conv",topic:"num", name:"Fractions, decimals and percentages",         tier:1, mod:"MC"},
  {id:"pct", topic:"num", name:"Percentage of an amount", tier:1, mod:"MC"},
  {id:"ind-laws", topic:"ind", name:"Multiplying and dividing powers", tier:2, mod:"MC"},
  {id:"ind-neg",  topic:"ind", name:"Negative indices",                            tier:2, mod:"MC"},
  {id:"ind-frac", topic:"ind", name:"Fractional indices",                          tier:2, mod:"M"},
  {id:"ind-zero", topic:"ind", name:"Zero index and scientific notation",          tier:1, mod:"MC"},
  {id:"roots",    topic:"ind", name:"Square roots",                                tier:2, mod:"M"},
  {id:"log-def",  topic:"ind", name:"Meaning of a logarithm",                      tier:2, mod:"M"},
  {id:"log-laws", topic:"ind", name:"Laws of logarithms",                          tier:3, mod:"M"},
  {id:"alg-like", topic:"alg", name:"Collecting like terms",                       tier:1, mod:"MC"},
  {id:"alg-sub",  topic:"alg", name:"Substituting values, including negatives",    tier:1, mod:"MC"},
  {id:"alg-exp",  topic:"alg", name:"Expanding a single bracket",                  tier:1, mod:"MC"},
  {id:"alg-sq",   topic:"alg", name:"Squaring a bracket",                          tier:2, mod:"M"},
  {id:"alg-dbl",  topic:"alg", name:"Multiplying two brackets",                    tier:2, mod:"M"},
  {id:"alg-fac",  topic:"alg", name:"Factorising",                                 tier:2, mod:"M"},
  {id:"alg-frac", topic:"alg", name:"Simplifying algebraic fractions",             tier:2, mod:"M"},
  {id:"eq-lin",   topic:"eqn", name:"Solving linear equations",                    tier:1, mod:"MC"},
  {id:"eq-trans", topic:"eqn", name:"Transposing a formula",                       tier:2, mod:"MC"},
  {id:"eq-ineq",  topic:"eqn", name:"Linear inequalities",                         tier:2, mod:"M"},

/* One real example per error tag, drawn from the bank itself rather than written by hand,
   so the citation is always accurate and needs no upkeep as items are added. */
let ERROR_EXAMPLE = null;
function errExample(tag){
  if(!ERROR_EXAMPLE){
    ERROR_EXAMPLE = {};
    ITEMS.forEach(it => it.opts.forEach(o => { if(o.e && !ERROR_EXAMPLE[o.e]) ERROR_EXAMPLE[o.e] = {skill:skillById[it.skill].name, stem:plainText(it.plain), wrong:plainText(o.t)}; }));
  }
  return ERROR_EXAMPLE[tag] || null;
}
/* A full, citable line for one error tag: the description the caller already resolved (each
   render context keeps its own fallback for older files' dictionaries, hence it is passed in
   rather than looked up here), then which skill and question it was seen in and what was
   chosen. The skill name is left out when the surrounding table or card already states it
   (skipSkill), since repeating it would be redundant, not wrong. */
function errCite(tag, description, skipSkill){
  const ex = errExample(tag);
  if(!ex) return esc(description);
  const where = skipSkill ? `"${esc(ex.stem)}" answered "${esc(ex.wrong)}"` : `${esc(ex.skill)} — "${esc(ex.stem)}" answered "${esc(ex.wrong)}"`;
  return `${esc(description)}<br><small>${where}</small>`;
}

function tex(str){
  const parts = String(str).split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if(p.startsWith("$") && p.endsWith("$") && p.length > 2){
      const src = p.slice(1, -1);
      if(typeof katex !== "undefined"){ try { return katex.renderToString("\\displaystyle " + src, {throwOnError:false}); } catch(e){} }
      return "<code>" + esc(src) + "</code>";
    }
    return esc(p);
  }).join("");
}
function plainText(str){ return String(str).replace(/\$/g,"").replace(/\\(frac|dfrac|tfrac)\{([^}]*)\}\{([^}]*)\}/g,"$2/$3").replace(/\\(times|cdot)/g,"×").replace(/\\(le|leq)/g,"≤").replace(/\\(ge|geq)/g,"≥").replace(/\\neq/g,"≠").replace(/\\sqrt\{([^}]*)\}/g,"√($1)").replace(/\\left|\\right|\\displaystyle/g,"").replace(/\\,/g," ").replace(/\\%/g,"%").replace(/\\pi/g,"π").replace(/\\(log|sin|cos|tan|lim|sum|prod|binom|text|circ|ldots|land|lnot|oplus|cap|cup|square|theta)/g,"$1").replace(/\\begin\{pmatrix\}/g,"[").replace(/\\end\{pmatrix\}/g,"]").replace(/\\\\/g,";").replace(/[{}]/g,""); }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function b64uEncode(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uDecode(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length % 4) str += "="; const s = atob(str); return Uint8Array.from(s, c => c.charCodeAt(0)); }

/* ==========================================================================
   COMPACT TEXT RESULTS
   Some submission routes will not take a file: a Google Form paragraph
   field, a Moodle text box, an email typed by hand. This packs one
   student's answers into a short string built the same way as the share
   link, so it can be pasted instead of uploaded. Confidence is kept exactly;
   time is kept to the nearest 10 seconds, which is enough for the "seconds
   per question" averages on the analysis page and is stated as approximate
   wherever it is shown.
   Per item: 4 bits for what happened (unanswered, skipped, don't know,
   don't understand the words, don't understand the task, or which option,
   0 to 3), 2 bits for confidence, 5 bits for the time bucket. 11 bits total,
   so even the full 157-item bank comes to under 350 characters.
   ========================================================================== */
const PASTE_UNANSWERED = 0, PASTE_SKIPPED = 1, PASTE_KIND = {idk:2, words:3, task:4};
const PASTE_KIND_REV = {2:"idk", 3:"words", 4:"task"};
const timeBucketEncode = sec => sec == null ? 0 : Math.max(0, Math.min(31, Math.round(sec / 10)));
const timeBucketDecode = b => b * 10;
const CONF_CODE = {"Sure":1, "Fairly sure":2, "Guessing":3}, CONF_NAME = {1:"Sure", 2:"Fairly sure", 3:"Guessing"};

class BitWriter{
  constructor(){ this.bytes = []; this.cur = 0; this.n = 0; }
  push(value, bits){ for(let i = bits - 1; i >= 0; i--){ this.cur = (this.cur << 1) | ((value >> i) & 1); this.n++; if(this.n === 8){ this.bytes.push(this.cur); this.cur = 0; this.n = 0; } } }
  finish(){ if(this.n > 0){ this.cur <<= (8 - this.n); this.bytes.push(this.cur); this.cur = 0; this.n = 0; } return Uint8Array.from(this.bytes); }
}
class BitReader{
  constructor(bytes){ this.bytes = bytes; this.pos = 0; }
  read(bits){ let v = 0; for(let i = 0; i < bits; i++){ const byteIdx = this.pos >> 3, bitIdx = 7 - (this.pos & 7); v = (v << 1) | ((this.bytes[byteIdx] >> bitIdx) & 1); this.pos++; } return v; }
}

/* run.fullPlan is the sitting's original order, before any hardest-first drop removed items from run.plan. */
function encodePasteResult(run){
  const skippedIds = new Set(run.skipped.map(p => p.item.id)), bw = new BitWriter();
  run.fullPlan.forEach(p => {
    const id = p.item.id;
    if(skippedIds.has(id)){ bw.push(PASTE_SKIPPED, 4); bw.push(0, 2); bw.push(0, 5); return; }
    const a = run.answers[id];
    if(!a){ bw.push(PASTE_UNANSWERED, 4); bw.push(0, 2); bw.push(0, 5); return; }
    bw.push(typeof a.choice === "string" ? PASTE_KIND[a.choice] : 5 + a.choice, 4);
    bw.push(CONF_CODE[a.conf] || 0, 2);
    bw.push(timeBucketEncode(a.seconds), 5);
  });
  const bits = bw.finish();
  const head = new Uint8Array(6);
  head[0] = 1; head[1] = run.timedOut ? 1 : 0;
  const el = Math.max(0, Math.min(65535, Math.round(run.elapsedNow())));
  head[2] = el & 255; head[3] = el >>> 8 & 255;
  head[4] = run.fullPlan.length & 255; head[5] = run.fullPlan.length >>> 8 & 255;
  const identBytes = new TextEncoder().encode(run.ident || "");
  const payload = new Uint8Array(head.length + bits.length + identBytes.length);
  payload.set(head, 0); payload.set(bits, head.length); payload.set(identBytes, head.length + bits.length);
  return run.code + "." + b64uEncode(payload);
}
/* The inverse of encodePasteResult: rebuilds an answers map identical in shape to a live sitting's, then hands it to buildResult so every chart and rule works the same whether the data came from a file or a pasted code. */
function decodePasteResult(text){
  const s = text.trim(), dot = s.indexOf(".");
  if(dot < 1) throw new Error("That does not look like a dewmath results code.");
  const configCode = s.slice(0, dot);
  let cfg, plan, payload;
  try { cfg = decodeCfg(configCode); plan = assemble(cfg); payload = b64uDecode(s.slice(dot + 1)); }
  catch(e){ throw new Error("The settings part of that code could not be read."); }
  if(!payload.length || payload[0] !== 1) throw new Error("That code is not in a format this page understands.");
  const timedOut = !!payload[1], elapsed = payload[2] | payload[3] << 8, n = payload[4] | payload[5] << 8;
  if(n !== plan.length) throw new Error("That code's settings do not match the number of questions it lists.");
  const br = new BitReader(payload.slice(6)), answers = {}, skipped = [];
  plan.forEach(p => {
    const state = br.read(4), conf = br.read(2), tb = br.read(5);
    if(state === PASTE_SKIPPED){ skipped.push(p); return; }
    if(state === PASTE_UNANSWERED) return;
    answers[p.item.id] = {choice: state in PASTE_KIND_REV ? PASTE_KIND_REV[state] : state - 5, conf:CONF_NAME[conf], seconds:timeBucketDecode(tb)};
  });
  const identBytes = payload.slice(6 + Math.ceil(11 * n / 8));
  const ident = new TextDecoder().decode(identBytes);
  const keptPlan = plan.filter(p => !skipped.includes(p));
  return buildResult({plan:keptPlan, skipped, cfg, answers, code:configCode, ident, vm:0, elapsed, timedOut, finishedAt:Date.now()});
}

function plotSVG(fig, small){
  const w = small ? 200 : 280, h = small ? 160 : 220, pad = 22;
  const [x0, x1] = fig.x, [y0, y1] = fig.y, [dx, dy] = fig.ticks || [1, 1];
  const sx = x => pad + (x - x0) / (x1 - x0) * (w - 2 * pad);
  const sy = y => h - pad - (y - y0) / (y1 - y0) * (h - 2 * pad);
  let s = `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(fig.label || "graph")}">`;
  s += `<rect x="${pad}" y="${pad}" width="${w - 2 * pad}" height="${h - 2 * pad}" fill="var(--field)" stroke="none"/>`;
  for(let x = Math.ceil(x0); x <= x1; x += dx){ s += `<line x1="${sx(x)}" y1="${pad}" x2="${sx(x)}" y2="${h - pad}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || x % (2 * dx) === 0) s += `<text x="${sx(x)}" y="${h - pad + 14}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${x}</text>`; }
  for(let y = Math.ceil(y0); y <= y1; y += dy){ s += `<line x1="${pad}" y1="${sy(y)}" x2="${w - pad}" y2="${sy(y)}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || y % (2 * dy) === 0) s += `<text x="${pad - 4}" y="${sy(y) + 3.5}" font-size="10" text-anchor="end" fill="var(--ink-soft)">${y}</text>`; }
  if(x0 <= 0 && x1 >= 0) s += `<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${h - pad}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  if(y0 <= 0 && y1 >= 0) s += `<line x1="${pad}" y1="${sy(0)}" x2="${w - pad}" y2="${sy(0)}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  s += `<text x="${w - pad + 4}" y="${(y0 <= 0 && y1 >= 0) ? sy(0) + 4 : h - pad}" font-size="11" fill="var(--ink-soft)" font-style="italic">x</text>`;
  s += `<text x="${(x0 <= 0 && x1 >= 0) ? sx(0) + 4 : pad}" y="${pad - 6}" font-size="11" fill="var(--ink-soft)" font-style="italic">y</text>`;
  for(const f of fig.fns){
    const fn = new Function("x", "return " + f);
    let d = "", pen = false;
    for(let i = 0; i <= 160; i++){
      const x = x0 + (x1 - x0) * i / 160; const y = fn(x);
      if(!isFinite(y) || y < y0 - 0.5 || y > y1 + 0.5){ pen = false; continue; }
      d += (pen ? " L" : " M") + sx(x).toFixed(1) + " " + sy(Math.max(y0, Math.min(y1, y))).toFixed(1); pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  return s + "</svg>";
}

/* ==========================================================================
   CONFIGURATION AND THE SHARE CODE (format 2)
   ========================================================================== */
const ORDERS = ["Mixed together", "Easiest first", "Hardest first", "Grouped by topic"];
const DEFAULT_CFG = {v:2, lang:0, ident:3, idk:true, conf:true, showScore:true, showItems:true, showAnswers:true, allowBack:true, order:1, drop:false, perSkill:2, viewLock:0, k:5, timer:0, maxQ:0, skills:SKILLS.map(s => s.id), seed:1, label:"", submitUrl:"", submitNote:"", idk2:true};

function encodeCfg(c){
  const b = [2, c.lang | c.ident << 2 | (c.idk ? 16 : 0) | (c.conf ? 32 : 0) | (c.showScore ? 64 : 0) | (c.showItems ? 128 : 0),
    c.perSkill | c.viewLock << 2 | (c.k & 15) << 4,
    (c.showAnswers ? 1 : 0) | (c.allowBack ? 2 : 0) | (c.order & 3) << 2 | (c.drop ? 16 : 0) | (c.idk2 ? 32 : 0),
    c.timer & 255, c.maxQ & 255];
  const nb = Math.ceil(SKILLS.length / 8); b.push(nb);
  const mask = new Array(nb).fill(0);
  c.skills.forEach(id => { const i = SKILLS.findIndex(s => s.id === id); if(i >= 0) mask[i >> 3] |= 1 << (i & 7); });
  b.push(...mask, c.seed & 255, c.seed >>> 8 & 255);
  const tail = [c.label || "", c.submitUrl || "", c.submitNote || ""].join("\u001f").replace(/\u001f+$/, "");
  return b64uEncode(Uint8Array.from([...b, ...new TextEncoder().encode(tail)]));
}
function decodeCfg(code){
  const u = b64uDecode(code); if(u.length < 10 || u[0] !== 2) throw new Error("bad code");
  const c = {v:2};
  c.lang = u[1] & 3; c.ident = u[1] >> 2 & 3; c.idk = !!(u[1] & 16); c.conf = !!(u[1] & 32); c.showScore = !!(u[1] & 64); c.showItems = !!(u[1] & 128);
  c.perSkill = u[2] & 3 || 1; c.viewLock = u[2] >> 2 & 3; c.k = u[2] >> 4 & 15 || 5;
  c.showAnswers = !!(u[3] & 1); c.allowBack = !!(u[3] & 2); c.order = u[3] >> 2 & 3; c.drop = !!(u[3] & 16); c.idk2 = !!(u[3] & 32);
  c.timer = u[4]; c.maxQ = u[5];
  const nb = u[6]; c.skills = SKILLS.filter((s, i) => (i >> 3) < nb && (u[7 + (i >> 3)] & (1 << (i & 7)))).map(s => s.id);
  const p = 7 + nb; c.seed = u[p] | u[p + 1] << 8;
  const tail = new TextDecoder().decode(u.slice(p + 2)).split("\u001f");
  c.label = tail[0] || ""; c.submitUrl = tail[1] || ""; c.submitNote = tail[2] || "";
  return c;
}
function baseUrl(){ return location.href.split("#")[0]; }

function assemble(cfg){
  const rng = mulberry32(cfg.seed * 7919 + 17);
  const chosen = shuffle(SKILLS.filter(s => cfg.skills.includes(s.id)), rng);
  const pools = chosen.map(s => shuffle(ITEMS.filter(it => it.skill === s.id), rng).slice(0, cfg.perSkill));
  let items = [];
  for(let r = 0; r < cfg.perSkill; r++) pools.forEach(p => { if(p[r]) items.push(p[r]); });
  if(cfg.maxQ && items.length > cfg.maxQ) items = items.slice(0, cfg.maxQ);
  items = shuffle(items, rng);
  const tier = it => skillById[it.skill].tier, ti = it => TOPICS.findIndex(t => t.id === skillById[it.skill].topic);
  if(cfg.order === 1) items.sort((a, b) => tier(a) - tier(b));
  if(cfg.order === 2) items.sort((a, b) => tier(b) - tier(a));
  if(cfg.order === 3) items.sort((a, b) => ti(a) - ti(b) || tier(a) - tier(b));
  return items.map(it => {
    const variant = cfg.lang === 2 ? (rng() < 0.5 ? "plain" : "tech") : (cfg.lang === 1 ? "tech" : "plain");
    const opts = shuffle(it.opts.map((o, i) => ({...o, src:i})), rng);
    if(cfg.idk){ opts.push({t:"I don't know", idk:"idk"}); if(cfg.idk2){ opts.push({t:"I don't understand some of the words in this question", idk:"words"}); opts.push({t:"I don't understand what the question is asking me to do", idk:"task"}); } }
    return {item:it, tier:tier(it), variant, opts};
  });
}

/* ==========================================================================
   RESULT BUILDER (pure: used by the sitting and by the sample class)
   ========================================================================== */
const NOANS = {idk:"I don't know", words:"I don't understand some of the words", task:"I don't understand what the question is asking"};
function buildResult(st){
  const {plan, skipped, cfg, answers} = st;
  const skills = {}, tiers = {};
  const rec = (p, n, a, isSkipped) => {
    const it = p.item, sk = skillById[it.skill];
    if(!skills[sk.id]) skills[sk.id] = {name:sk.name, topic:sk.topic, tier:sk.tier, total:0, correct:0, idk:0, words:0, task:0, unanswered:0, skipped:0, errors:[]};
    if(!tiers[sk.tier]) tiers[sk.tier] = {total:0, correct:0, idk:0, words:0, task:0, unanswered:0, skipped:0};
    const S = skills[sk.id], T = tiers[sk.tier];
    const r = {n, id:it.id, skill:sk.id, topic:sk.topic, tier:sk.tier, variant:p.variant, answered:!!a && !isSkipped, skipped:!!isSkipped, choice:null, correct:null, error:null, confidence:a ? a.conf || null : null, seconds:a ? a.seconds : null};
    if(isSkipped){ S.skipped++; T.skipped++; return r; }
    S.total++; T.total++;
    if(!a){ S.unanswered++; T.unanswered++; return r; }
    if(typeof a.choice === "string"){ r.choice = NOANS[a.choice] || "I don't know"; r.noAnswer = a.choice; r.correct = false; S.idk++; T.idk++; if(a.choice !== "idk"){ S[a.choice]++; T[a.choice]++; } return r; }
    const o = p.opts[a.choice]; r.choice = plainText(o.t); r.position = a.choice; r.correct = !!o.ok; r.error = o.e || null;
    if(o.ok){ S.correct++; T.correct++; } else if(o.e) S.errors.push(o.e);
    return r;
  };
  const items = plan.map((p, i) => rec(p, i + 1, answers[p.item.id], false)).concat((skipped || []).map((p, i) => rec(p, plan.length + i + 1, null, true)));
  const answered = items.filter(i => i.answered).length, correct = items.filter(i => i.correct).length, total = plan.length;
  return {
    schema:"dewmath-result/2", bankVersion:BANK_VERSION, generatedAt:new Date(st.finishedAt || Date.now()).toISOString(),
    config:{code:st.code, label:cfg.label, language:["plain", "technical", "mixed"][cfg.lang], identityMode:["anonymous", "pseudonym", "code", "name"][cfg.ident], timerMinutes:cfg.timer, order:ORDERS[cfg.order], dropOffered:cfg.drop, perSkill:cfg.perSkill, maxQuestions:cfg.maxQ, skills:cfg.skills},
    student:{identity:st.ident || null}, viewMode:["", "one-at-a-time", "all-at-once", "paged"][st.vm],
    elapsedSeconds:st.elapsed, timedOut:!!st.timedOut,
    items, summary:{total, answered, correct, idk:items.filter(i => i.noAnswer).length, words:items.filter(i => i.noAnswer === "words").length, task:items.filter(i => i.noAnswer === "task").length, skipped:(skipped || []).length, skills, tiers},
    dictionary:{skills:Object.fromEntries(Object.keys(skills).map(k => [k, skillById[k].name])), topics:Object.fromEntries(TOPICS.map(t => [t.id, t.name])), tiers:TIERS, errors:Object.fromEntries([...new Set(items.map(i => i.error).filter(Boolean))].map(e => [e, ERRORS[e] || e]))}
  };
}

/* ==========================================================================
   SAMPLE CLASS: twelve simulated students with distinct profiles
   ========================================================================== */
const PERSONAS = [
  {name:"Aoife",  p:{1:.97, 2:.92, 3:.85}, idk:.02, conf:"calibrated", speed:.8},
  {name:"Brian",  p:{1:.95, 2:.85, 3:.45}, idk:.15, conf:"calibrated", speed:1},
  {name:"Ciara",  p:{1:.9,  2:.75, 3:.3},  idk:.2,  conf:"calibrated", speed:1},
  {name:"Dara",   p:{1:.8,  2:.6,  3:.3},  idk:.1,  conf:"calibrated", speed:1.1, topic:{num:.4}},
  {name:"Emma",   p:{1:.75, 2:.55, 3:.3},  idk:0,   conf:"over",       speed:.7},
  {name:"Fionn",  p:{1:.85, 2:.65, 3:.3},  idk:.45, conf:"under",      speed:1.2},
  {name:"Grace",  p:{1:.85, 2:.65, 3:.35}, idk:.1,  conf:"calibrated", speed:1, topic:{alg:.35}},
  {name:"Hassan", p:{1:.55, 2:.35, 3:.15}, idk:.25, conf:"calibrated", speed:1.2, task:.4},
  {name:"Iris",   p:{1:.9,  2:.75, 3:.4},  idk:.1,  conf:"calibrated", speed:1, topic:{gra:.35}},
  {name:"Jack",   p:{1:.7,  2:.5,  3:.3},  idk:0,   conf:"guess",      speed:.4},
  {name:"Kasia",  p:{1:.9,  2:.75, 3:.45}, idk:.1,  conf:"calibrated", speed:1.1, techPenalty:.35, words:.6},
  {name:"Liam",   p:{1:.8,  2:.6,  3:.3},  idk:.1,  conf:"calibrated", speed:1.8}
];
function simulateClass(){
  const cfg = {...DEFAULT_CFG, lang:2, conf:true, ident:3, idk2:true, timer:90, seed:4242, label:"Sample class (simulated)"};
  const code = encodeCfg(cfg), plan = assemble(cfg), start = Date.parse("2026-09-14T10:00:00Z");
  return PERSONAS.map((P, k) => {
    const rng = mulberry32(1000 + k * 97), answers = {}; let elapsed = 0, timedOut = false;
    const limitSec = cfg.timer * 60;
    for(const p of plan){
      const sk = skillById[p.item.skill];
      let pc = P.p[sk.tier]; if(P.topic && P.topic[sk.topic] !== undefined) pc = Math.min(pc, P.topic[sk.topic]);
      if(P.techPenalty && p.variant === "tech") pc -= P.techPenalty;
      const right = rng() < pc;
      const wrong = p.opts.map((o, i) => i).filter(i => !p.opts[i].ok && !p.opts[i].idk);
      let choice;
      if(right) choice = p.opts.findIndex(o => o.ok);
      else if(P.words && p.variant === "tech" && rng() < P.words) choice = "words";
      else if(P.task && rng() < P.task) choice = "task";
      else if(rng() < P.idk) choice = "idk";
      else choice = wrong[Math.floor(rng() * wrong.length)];
      let conf;
      const r = rng();
      if(P.conf === "over") conf = r < .85 ? "Sure" : "Fairly sure";
      else if(P.conf === "under") conf = r < .15 ? "Sure" : r < .6 ? "Fairly sure" : "Guessing";
      else if(P.conf === "guess") conf = r < .3 ? "Sure" : r < .5 ? "Fairly sure" : "Guessing";
      else conf = right ? (r < .7 ? "Sure" : r < .95 ? "Fairly sure" : "Guessing") : (r < .2 ? "Sure" : r < .55 ? "Fairly sure" : "Guessing");
      const seconds = Math.max(6, Math.round((12 + sk.tier * 8 + rng() * 22) * P.speed));
      /* the real sitting stops at the time limit, so the simulation does too */
      if(limitSec && elapsed + seconds > limitSec){ timedOut = true; elapsed = limitSec; break; }
      elapsed += seconds;
      answers[p.item.id] = {choice, conf, seconds};
    }
    return buildResult({plan, skipped:[], cfg, answers, code, ident:P.name, vm:1, elapsed, timedOut, finishedAt:start + k * 60000 + elapsed * 1000});
  });
}

/* ==========================================================================
   STUDENT: THE SITTING
   ========================================================================== */
function startRun(code, c, plan, ident, vm, saved){
  const pageSize = vm === 1 ? 1 : vm === 2 ? plan.length : c.k;
  run = {code, c, fullPlan:plan.slice(), plan:plan.slice(), skipped:[], ident, vm, pageSize, page:0, answers:{}, started:Date.now(), lastEvent:Date.now(), timedOut:false, finished:false, offered:{}, offer:null};
  run.elapsedNow = () => run.finished ? run.elapsedFinal : Math.round((Date.now() - run.started) / 1000);
  if(saved){
    run.answers = saved.answers || {}; run.started = saved.started || run.started; run.page = saved.page || 0; run.offered = saved.offered || {};
    if(saved.skippedIds){ run.skipped = run.plan.filter(p => saved.skippedIds.includes(p.item.id)); run.plan = run.plan.filter(p => !saved.skippedIds.includes(p.item.id)); }
  }
  if(c.timer){ run.deadline = run.started + c.timer * 60000; run.tick = setInterval(tickTimer, 1000); }
  renderPage();
}
function persist(){
  if(!run || run.finished) return;
  try { localStorage.setItem("dewmath2:" + run.code, JSON.stringify({answers:run.answers, started:run.started, page:run.page, offered:run.offered, skippedIds:run.skipped.map(p => p.item.id)})); }
  catch(e){ return; }
  const el = $("#saved"); if(el){ el.textContent = "Saved"; clearTimeout(run.savedT); run.savedT = setTimeout(() => { if($("#saved")) $("#saved").textContent = "Saved"; }, 1500); }
}
function tickTimer(){
  const el = $("#timer"); if(!run || run.finished) return;
  const left = Math.max(0, run.deadline - Date.now());
  if(el){ const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); el.textContent = `${m}:${String(s).padStart(2, "0")} left`; el.classList.toggle("low", left < 120000); }
  if(left <= 0){ run.timedOut = true; finishRun(); }
}
/* The drop-a-level check, after each answer in hardest-first mode. */
function checkDrop(tier){
  const {c, plan, answers} = run;
  if(!c.drop || c.order !== 2 || run.vm === 2 || run.offered[tier]) return;
  const done = plan.filter(p => p.tier === tier && answers[p.item.id]);
  if(done.length < 4) return;
  const last4 = done.slice(-4), misses = last4.filter(p => { const a = answers[p.item.id]; return typeof a.choice === "string" || !p.opts[a.choice].ok; }).length;
  const remaining = plan.filter(p => p.tier === tier && !answers[p.item.id]).length;
  const lowerExists = plan.some(p => p.tier < tier && !answers[p.item.id]);
  if(misses >= 3 && remaining > 0 && lowerExists){ run.offered[tier] = true; run.offer = {tier, remaining}; persist(); showOffer(); }
}
function offerHTML(){ return `<div class="notice" id="offer"><p><strong>These questions are pitched at a high level, and the last few have not gone in.</strong> That is expected: the harder material comes first here. You can skip the remaining ${run.offer.remaining} question${run.offer.remaining > 1 ? "s" : ""} at this level and move on to the next. Skipped questions are recorded as skipped and count as neither right nor wrong.</p><div class="row"><button id="doDrop">Skip to the next level</button><button class="quiet" id="noDrop">Keep going</button></div></div>`; }
function showOffer(){
  if($("#offer")) $("#offer").remove();
  app.querySelector(".topbar").insertAdjacentHTML("afterend", offerHTML());
  $("#doDrop").addEventListener("click", () => dropTier(run.offer.tier));
  $("#noDrop").addEventListener("click", () => { run.offer = null; $("#offer").remove(); });
  $("#offer").scrollIntoView({block:"nearest"});
}
function dropTier(tier){
  const rest = run.plan.filter(p => p.tier === tier && !run.answers[p.item.id]);
  run.skipped.push(...rest); run.plan = run.plan.filter(p => !rest.includes(p));
  const first = run.plan.findIndex(p => !run.answers[p.item.id]);
  run.page = first < 0 ? Math.max(0, Math.ceil(run.plan.length / run.pageSize) - 1) : Math.floor(first / run.pageSize);
  run.offer = null; persist(); renderPage(); window.scrollTo(0, 0);
}

const ENCOURAGE = {
  idk:"That is fine. This is about finding out where to start, and there is no shame in not knowing something yet.",
  words:"Thank you for saying so. That tells your teacher which words to go over, and it is one of the most useful answers you can give.",
  task:"Thank you for saying so. Knowing which questions are hard to read is as useful to your teacher as knowing which sums are hard."
};
function renderPage(){
  app.className = "";
  const {plan, pageSize, c} = run;
  const pages = Math.max(1, Math.ceil(plan.length / pageSize));
  run.page = Math.min(run.page, pages - 1);
  const page = run.page, slice = plan.slice(page * pageSize, (page + 1) * pageSize);
  const answered = plan.filter(p => run.answers[p.item.id]).length;
  const items = slice.map(p => {
    const it = p.item, a = run.answers[it.id] || {}, idx = plan.indexOf(p) + 1;
    const figOpts = p.opts.some(o => o.fig);
    return `<section class="item" data-id="${it.id}" data-tier="${p.tier}">
      <div class="num">Question ${idx} of ${plan.length}</div>
      <p class="stem">${tex(p.variant === "tech" ? it.tech : it.plain)}</p>
      ${it.fig ? plotSVG(it.fig) : ""}
      <div class="opts ${figOpts ? "figs" : ""}" role="radiogroup">
        ${p.opts.map((o, i) => { const v = o.idk ? o.idk : i, chk = String(a.choice) === String(v) ? "checked" : "";
          return `<label class="opt ${o.fig ? "fig" : ""} ${o.idk ? "idk" : ""}">${o.fig ? plotSVG(o.fig, true) + `<span class="caption"><input type="radio" name="q-${it.id}" value="${v}" ${chk}> Graph ${"ABCDEF"[i]}</span>` : `<input type="radio" name="q-${it.id}" value="${v}" ${chk}><span>${tex(o.t)}</span>`}</label>`; }).join("")}
      </div>
      <p class="encourage" data-enc hidden></p>
      ${c.conf ? `<div class="conf">How sure are you? ${["Sure", "Fairly sure", "Guessing"].map(l => `<button type="button" data-conf="${l}" class="${a.conf === l ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}
    </section>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><div><strong>${esc(c.label || "Maths readiness check")}</strong> <span class="saved" id="saved">${answered ? "Saved" : "Answers save automatically"}</span><div class="progress" aria-hidden="true"><div style="width:${answered / plan.length * 100}%"></div></div></div>
    <div class="timer" id="timer"></div></div>
  ${items}
  <div class="nav">
    <div>${page > 0 && (c.allowBack || pageSize === plan.length) ? `<button class="quiet" id="prev">Back</button>` : ""}</div>
    <div>${page < pages - 1 ? `<button id="next">Next</button>` : `<button id="finish">Finish</button>`}</div>
  </div>`;
  if(c.timer) tickTimer();
  app.querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", e => {
    const id = e.target.name.slice(2), now = Date.now();
    const prev = run.answers[id] || {};
    const v = e.target.value, kind = /^\d+$/.test(v) ? null : v;
    run.answers[id] = {choice:kind || +v, conf:prev.conf, seconds:prev.seconds ?? Math.round((now - run.lastEvent) / 1000)};
    run.lastEvent = now; persist();
    const enc = e.target.closest(".item").querySelector("[data-enc]");
    if(kind){ enc.textContent = ENCOURAGE[kind]; enc.hidden = false; } else enc.hidden = true;
    const bar = app.querySelector(".progress div"); if(bar) bar.style.width = (plan.filter(p => run.answers[p.item.id]).length / plan.length * 100) + "%";
    checkDrop(+e.target.closest(".item").dataset.tier);
  }));
  app.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = b.closest(".item").dataset.id; run.answers[id] = {...(run.answers[id] || {}), conf:b.dataset.conf};
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); persist();
  }));
  if(run.offer) showOffer();
  app.querySelectorAll(".item").forEach(sec => { const a = run.answers[sec.dataset.id]; if(a && typeof a.choice === "string"){ const enc = sec.querySelector("[data-enc]"); enc.textContent = ENCOURAGE[a.choice]; enc.hidden = false; } });
  if($("#prev")) $("#prev").addEventListener("click", () => { run.page--; run.offer = null; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#next")) $("#next").addEventListener("click", () => { run.page++; run.offer = null; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#finish")) $("#finish").addEventListener("click", () => {
    const left = plan.length - plan.filter(p => run.answers[p.item.id]).length;
    if(left && !confirm(`You have ${left} unanswered question${left > 1 ? "s" : ""}. Finish anyway? Unanswered questions are recorded as not attempted.`)) return;
    finishRun();
  });
}

function finishRun(){
  if(run.finished) return; run.finished = true; clearInterval(run.tick);
  localStorage.removeItem("dewmath2:" + run.code);
  const c = run.c;
  run.elapsedFinal = Math.round((Date.now() - run.started) / 1000);
  const r = buildResult({plan:run.plan, skipped:run.skipped, cfg:c, answers:run.answers, code:run.code, ident:run.ident, vm:run.vm, elapsed:run.elapsedFinal, timedOut:run.timedOut});
  const pasteCode = encodePasteResult(run);
  const safe = (r.student.identity || "anonymous").replace(/[^\w\-]+/g, "_").slice(0, 30);
  const fname = `dewmath-${safe}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  const href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 1)], {type:"application/json"}));
  try { localStorage.setItem("dewmath2:last:" + run.code, JSON.stringify({...r, _filename:fname, _pasteCode:pasteCode})); } catch(e){}
  const isMail = /^mailto:/i.test(c.submitUrl || "");

        : `Go to where your teacher asked, and either upload the file or paste the text. <a class="btn quiet" href="${esc(c.submitUrl)}" target="_blank" rel="noopener">Open that page</a>`

    : `<li><span>Send it to your teacher in the way they asked, either the file or the text below.${c.submitNote ? `<br><small>${esc(c.submitNote)}</small>` : ""}</span></li>`;
  const list = c.showItems ? `<h2>Question by question</h2><ul class="result-list">${r.items.filter(i => !i.skipped).map((i, k) => {
    const p = run.plan[k]; const mark = !i.answered ? ["skip", "–", "Not attempted"] : i.noAnswer ? ["skip", "?", i.choice] : i.correct ? ["ok", "✓", "Correct"] : ["no", "✗", "Wrong this time"];
    const ans = c.showAnswers && !i.correct ? `<small>Correct answer: ${p.opts.find(o => o.ok).fig ? "Graph " + "ABCDEF"[p.opts.findIndex(o => o.ok)] : tex(p.opts.find(o => o.ok).t)}</small>` : "";
    return `<li><span class="mark ${mark[0]}">${mark[1]}</span><span>${tex(p.variant === "tech" ? p.item.tech : p.item.plain)}<br><small>${esc(skillById[i.skill].name)}</small></span><span>${mark[2]}<br>${ans}</span></li>`; }).join("")}</ul>` : "";
  app.innerHTML = `
  <h1>Finished</h1>
  ${run.timedOut ? `<p class="notice">The time ran out, so this is what you had answered by then.</p>` : ""}

  <ol class="steps">
    <li><span>Choose one: download a file, or copy a short piece of text. Either one carries the same answers.
      <div class="row" style="margin-top:.5rem"><a class="btn" id="dl" href="${href}" download="${fname}">Download my results file</a><button class="quiet" id="showPaste">Show the text version instead</button></div>
      <div id="pasteBlock" hidden style="margin-top:.75rem">
        <textarea id="pasteCode" readonly rows="3" style="font-family:ui-monospace,monospace;font-size:.85rem" onclick="this.select()">${esc(pasteCode)}</textarea>
        <div class="row" style="margin-top:.4rem"><button class="quiet small" id="copyPaste">Copy this text</button><small>Paste it into the box, form field or email your teacher asked for.</small></div>
      </div>
      <br><small>The file is called <span class="code">${esc(fname)}</span> and will be in your Downloads folder. Either version records only your answers, and stays on this device until you send it.</small></span></li>

}

  /* Returns a notice paragraph rather than writing to the page directly, since renderReport

    rows.slice(1).forEach((row, i) => {
      if(!row.some(c => c.trim())) return;
      const rid = idCol >= 0 ? row[idCol] : null;
      const key = rid !== null ? filename + ":" + rid : null;
      if(key && seenCsvIds.has(key)){ skippedDup++; return; }
      const candidates = [row[row.length - 1], ...row.slice(0, -1)];
      let decoded = null;
      for(const c of candidates){ if(!c || !c.includes(".")) continue; try { decoded = decodePasteResult(c); break; } catch(e){} }
      if(decoded){ decoded._file = filename + " row " + (i + 2); results.push(decoded); added++; if(key) seenCsvIds.add(key); }
      else bad.push(i + 2);
    });
    let msg = `<p class="notice ${added ? "good" : "bad"}">${esc(filename)}: ${added} result${added === 1 ? "" : "s"} added`;
    if(skippedDup) msg += `, ${skippedDup} already read`;

function hbars(rows, opts){
  const o = {max:1, fmt:v => Math.round(v * 100) + "%", w:640, rowH:22, labelW:230, ...opts};
  const h = rows.length * o.rowH + 6, bw = o.w - o.labelW - 60;
  let s = `<svg viewBox="0 0 ${o.w} ${h}" class="chart" role="img" aria-label="${esc(o.label || "bar chart")}">`;
  rows.forEach((r, i) => {
    const y = i * o.rowH + 3, len = Math.max(0, Math.min(1, r.value / o.max)) * bw;
    s += `<text x="${o.labelW - 8}" y="${y + 15}" font-size="12" text-anchor="end" fill="var(--ink)">${esc(r.label)}</text>`;
    s += `<rect x="${o.labelW}" y="${y + 3}" width="${bw}" height="${o.rowH - 8}" fill="var(--rule)" opacity=".5"/>`;
    s += `<rect x="${o.labelW}" y="${y + 3}" width="${len.toFixed(1)}" height="${o.rowH - 8}" fill="${r.color || "var(--accent)"}"/>`;
    const txt = esc(o.fmt(r.value)) + (r.note ? " " + esc(r.note) : "");
    if(len > bw * 0.7) s += `<text x="${o.labelW + len - 6}" y="${y + 15}" font-size="12" text-anchor="end" fill="#fff">${txt}</text>`;
    else s += `<text x="${o.labelW + len + 6}" y="${y + 15}" font-size="12" fill="var(--ink-soft)">${txt}</text>`;
  });
  return s + "</svg>";
}
function vbars(rows, opts){
  const o = {max:null, w:640, h:200, fmt:v => v, label:"chart", ...opts};
  const max = o.max || Math.max(1, ...rows.map(r => r.value)), n = rows.length, pad = 30, bw = (o.w - 2 * pad) / n;
  let s = `<svg viewBox="0 0 ${o.w} ${o.h}" class="chart" role="img" aria-label="${esc(o.label)}">`;
  s += `<line x1="${pad}" y1="${o.h - 30}" x2="${o.w - pad}" y2="${o.h - 30}" stroke="var(--ink-soft)"/>`;
  rows.forEach((r, i) => {
    const bh = (r.value / max) * (o.h - 60), x = pad + i * bw + bw * 0.15, y = o.h - 30 - bh;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bh.toFixed(1)}" fill="${r.color || "var(--accent)"}"/>`;
    s += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(y - 4).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink-soft)">${esc(o.fmt(r.value))}</text>`;
    s += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${o.h - 12}" font-size="11" text-anchor="middle" fill="var(--ink)">${esc(r.label)}</text>`;
  });
  return s + "</svg>";
}
const TOPIC_COLORS = {num:"#2A6F8F", ind:"#3B7A57", alg:"#8A6D1F", eqn:"#7A4E8F", gra:"#B4553A", geo:"#4E8F8A", dis:"#5C6B8F", seq:"#8F5C6B", prb:"#6B8F5C", cal:"#8F7A5C"};
const BANDS = {strong:"Strong background", ready:"Ready for the module", core:"Core gaps", foundation:"Foundation support", unclear:"Too little data"};
const BAND_COLORS = {strong:"var(--good)", ready:"var(--accent)", core:"var(--warn)", foundation:"var(--bad)", unclear:"var(--ink-soft)"};

/* ---- thresholds: the teacher owns these; stored in the browser ---- */
const TH_DEFAULT = {found:70, strongAdv:65, strongCore:75, readyCore:50, flag:50, watch:60, minItems:6, timeoutPct:80, margin:5};
const TH_TEXT = {
  found:"Foundation support: a student goes here when their foundation percentage is below",
  strongAdv:"Strong background: advanced percentage at least",
  strongCore:"Strong background: and core percentage at least",
  readyCore:"Ready for the module: core percentage at least (otherwise Core gaps)",
  flag:"A skill is flagged for a student when their percentage on it is below",
  watch:"A skill is marked worth checking when the percentage is below (and above the flag line)",
  minItems:"A level counts towards a band only when the student attempted at least this many of its items",
  timeoutPct:"A student who ran out of time before reaching this percentage of the questions goes to Foundation support",
  margin:"A band is marked as a narrow decision when it was decided by this many points or fewer"
};
function loadTH(){ try { return {...TH_DEFAULT, ...JSON.parse(localStorage.getItem("dewmath:thresholds") || "{}")}; } catch(e){ return {...TH_DEFAULT}; } }
function saveTH(t){ try { localStorage.setItem("dewmath:thresholds", JSON.stringify(t)); } catch(e){} }

/* Percentages count attempted items only, so a student who ran out of time is judged on what they saw. */
function attempted(S){ return S ? S.total - (S.unanswered || 0) : 0; }
function tierPct(r, t, TH){ const T = (r.summary.tiers || {})[t]; if(!T) return null; const n = attempted(T); if(!n || (TH && n < TH.minItems)) return null; return T.correct / n; }

/* The band, with the reason and the margin it was decided by. */
function bandOf(r, TH){
  const p1 = tierPct(r, 1, TH), p2 = tierPct(r, 2, TH), p3 = tierPct(r, 3, TH);
  const pt = p => Math.round(p * 100), reached = r.summary.total ? Math.round(100 * r.summary.answered / r.summary.total) : 0;
  if(r.timedOut && reached < TH.timeoutPct) return {band:"foundation", why:`ran out of time after reaching ${reached}% of the questions, below the ${TH.timeoutPct}% line`, margin:null};
  if(p1 !== null && p1 * 100 < TH.found) return {band:"foundation", why:`foundation items at ${pt(p1)}%, below the ${TH.found}% line`, margin:TH.found - pt(p1)};
  if(p1 === null && (r.summary.tiers || {})[1]) return {band:"unclear", why:`fewer than ${TH.minItems} foundation items were attempted`, margin:null};
  if(p3 !== null && p3 * 100 >= TH.strongAdv && (p2 === null || p2 * 100 >= TH.strongCore)) return {band:"strong", why:`advanced items at ${pt(p3)}% (line ${TH.strongAdv}%)${p2 !== null ? ` and core at ${pt(p2)}% (line ${TH.strongCore}%)` : ""}`, margin:Math.min(pt(p3) - TH.strongAdv, p2 !== null ? pt(p2) - TH.strongCore : 99)};
  if(p2 === null || p2 * 100 >= TH.readyCore) return {band:"ready", why:p2 === null ? "no core items were attempted, so the foundation result decides" : `core items at ${pt(p2)}%, at or above the ${TH.readyCore}% line`, margin:p2 === null ? null : pt(p2) - TH.readyCore};
  return {band:"core", why:`core items at ${pt(p2)}%, below the ${TH.readyCore}% line`, margin:TH.readyCore - pt(p2)};
}
function upgrade(r){
  if(!r.summary.tiers){
    const tiers = {};
    r.items.forEach(i => { const t = (skillById[i.skill] || {}).tier || 2; i.tier = t; tiers[t] = tiers[t] || {total:0, correct:0, idk:0, words:0, task:0, unanswered:0, skipped:0}; tiers[t].total++; if(i.correct) tiers[t].correct++; if(i.choice === "I don't know") tiers[t].idk++; if(!i.answered) tiers[t].unanswered++; });
    r.summary.tiers = tiers; r.summary.idk = r.items.filter(i => i.choice === "I don't know").length; r.summary.skipped = 0;
    Object.values(r.summary.skills).forEach(S => { S.tier = S.tier || 2; S.skipped = 0; });
  }
  r.summary.words = r.summary.words || 0; r.summary.task = r.summary.task || 0;
  r.items.forEach(i => { if(!i.noAnswer && i.choice === "I don't know") i.noAnswer = "idk"; });
  return r;
}

let activeTab = "overview";
function renderReport(results){
  if(!results.length) return;

  const TH = loadTH();
  const names = results.map((r, i) => r.student.identity || `Student ${i + 1}`);
  const skillIds = [...new Set(results.flatMap(r => Object.keys(r.summary.skills)))].sort((a, b) => SKILLS.findIndex(s => s.id === a) - SKILLS.findIndex(s => s.id === b));
  const skillName = id => (skillById[id] || {}).name || results.find(r => r.dictionary.skills[id])?.dictionary.skills[id] || id;
  const skillTier = id => (skillById[id] || {}).tier || results.find(r => r.summary.skills[id])?.summary.skills[id].tier || 2;
  const skillTopic = id => (skillById[id] || {}).topic || results.find(r => r.summary.skills[id])?.summary.skills[id].topic || "num";
  const errName = e => ERRORS[e] || results.find(r => r.dictionary.errors[e])?.dictionary.errors[e] || e;
  const pctOf = S => S && attempted(S) ? S.correct / attempted(S) : null;
  const flagged = S => { const p = pctOf(S); return p !== null && p * 100 < TH.flag; };
  const watch = S => { const p = pctOf(S); return p !== null && p * 100 >= TH.flag && p * 100 < TH.watch; };
  const meanOf = id => { const Ss = results.map(r => r.summary.skills[id]).filter(S => S && attempted(S)); return Ss.length ? Ss.reduce((a, S) => a + pctOf(S), 0) / Ss.length : null; };
  const cell = p => p === null ? `<td class="c muted">–</td>` : `<td class="c" style="background:${p * 100 < TH.flag ? "var(--bad-wash)" : p * 100 < TH.watch ? "var(--warn-wash)" : p < 1 ? "var(--wash)" : "var(--good-wash)"}">${Math.round(p * 100)}</td>`;
  const bands = results.map(r => bandOf(r, TH));
  const scores = results.map(r => r.summary.answered ? r.summary.correct / r.summary.answered : 0);
  const anyConf = results.some(r => r.items.some(i => i.confidence));
  const anyMixed = results.some(r => r.config.language === "mixed");
  const anyWords = results.some(r => r.summary.words || r.summary.task);
  const bandTag = b => `<span class="band" style="color:${BAND_COLORS[b.band]}">${BANDS[b.band]}</span>`;
  const marginNote = b => b.margin !== null && b.margin <= TH.margin ? ` <span class="margin">narrow: ${b.margin} point${b.margin === 1 ? "" : "s"}</span>` : "";

  /* ---------- overview ---------- */
  const meanScore = scores.reduce((a, b) => a + b, 0) / scores.length;
  const bins = [0,0,0,0,0]; scores.forEach(s => bins[Math.min(4, Math.floor(s * 5))]++);
  const hist = vbars(["0–19%","20–39%","40–59%","60–79%","80–100%"].map((l, i) => ({label:l, value:bins[i]})), {h:170, label:"Score distribution", fmt:v => v ? v : ""});
  const bandCounts = Object.keys(BANDS).map(b => ({label:BANDS[b], value:bands.filter(x => x.band === b).length, color:BAND_COLORS[b]})).filter(x => x.value || x.label !== BANDS.unclear);
  const flagCounts = skillIds.map(id => ({id, n:results.filter(r => flagged(r.summary.skills[id])).length, tier:skillTier(id)})).filter(x => x.n > 0);
  const priorities = flagCounts.filter(x => x.tier < 3).sort((a, b) => a.tier - b.tier || b.n - a.n || meanOf(a.id) - meanOf(b.id)).slice(0, 6);
  const stretch = flagCounts.filter(x => x.tier === 3).sort((a, b) => b.n - a.n || meanOf(a.id) - meanOf(b.id)).slice(0, 4);
  const tierRows = [1,2,3].map(t => { const ps = results.map(r => tierPct(r, t)).filter(p => p !== null); return {label:`${TIERS[t]} (${ps.length} students)`, value:ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0}; });

  const overview = `
    <h2>${results.length} result${results.length > 1 ? "s" : ""}: mean score ${Math.round(meanScore * 100)}% of questions attempted</h2>
    ${priorities.length ? `<div class="notice good"><strong>Where to start:</strong> ${priorities.map(p => `${esc(skillName(p.id))} (${p.n} of ${results.length} students flagged)`).join("; ")}.</div>` : `<div class="notice good">No foundation or core skill is flagged for any student.</div>`}
    ${stretch.length ? `<p class="muted"><strong>Advanced material most often missed</strong> (expected before the module): ${stretch.map(p => `${esc(skillName(p.id))} (${p.n})`).join("; ")}.</p>` : ""}
    <div class="grid2">
      <div><h3>Score distribution</h3>${hist}</div>
      <div><h3>Readiness bands</h3>${hbars(bandCounts, {max:results.length, fmt:v => v + " student" + (v === 1 ? "" : "s"), labelW:190, w:520, label:"Students per band"})}
      <p class="muted">Each band has a stated rule and a stated cutoff. The rules are listed on the Students tab and the cutoffs can be changed on the Thresholds tab.</p></div>
    </div>
    <div class="grid2">
      <div><h3>By level</h3>${hbars(tierRows, {labelW:200, w:520, label:"Mean percent correct by level"})}</div>
      <div><h3>By topic, weakest first</h3>${hbars(topicRows, {labelW:230, w:520, label:"Mean percent correct by topic"})}</div>

    <p>Every percentage below counts attempted questions only. Unattempted questions, from running out of time, are left out.</p>
    <dl class="kv">
      <dt>${BANDS.foundation}</dt><dd>Foundation percentage below ${TH.found}%. A student who ran out of time before reaching ${TH.timeoutPct}% of the questions also goes here, because the pace itself is a signal.</dd>
      <dt>${BANDS.strong}</dt><dd>Foundation at or above ${TH.found}%, advanced at or above ${TH.strongAdv}%, and core at or above ${TH.strongCore}%.</dd>
      <dt>${BANDS.ready}</dt><dd>Foundation at or above ${TH.found}% and core at or above ${TH.readyCore}%, without meeting the strong rule.</dd>
      <dt>${BANDS.core}</dt><dd>Foundation at or above ${TH.found}% and core below ${TH.readyCore}%.</dd>

    </dl>
    <p>The rules are checked in that order and the first one that fits is the band. A band decided by ${TH.margin} points or fewer is marked as narrow; treat a narrow band as a prompt to read the report card before relying on the label. All of these numbers can be changed on the Thresholds tab.</p></details>`;
  const studentRows = results.map((r, i) => {
    const fl = [1,2,3].map(t => skillIds.filter(id => skillTier(id) === t && flagged(r.summary.skills[id])).length);
    return `<tr><td>${esc(names[i])}</td><td>${bandTag(bands[i])}${marginNote(bands[i])}</td><td class="c">${r.summary.correct}/${r.summary.answered}</td>${cell(tierPct(r, 1, TH))}${cell(tierPct(r, 2, TH))}${cell(tierPct(r, 3, TH))}<td class="c">${r.summary.idk || 0}</td><td class="c">${Math.round(r.elapsedSeconds / 60)} min${r.timedOut ? ` (timed out at ${Math.round(100 * r.summary.answered / r.summary.total)}%)` : ""}</td><td class="c">${fl[0]}</td><td class="c">${fl[1]}</td><td class="c">${fl[2]}</td></tr>`;

  }).join("");
  const students = `
    <h2>Students</h2>
    ${rules}
    <div class="scroll"><table><thead><tr><th>Student</th><th>Band</th><th>Score</th><th>Foundation %</th><th>Core %</th><th>Advanced %</th><th>Don't know</th><th>Time</th><th>Foundation flags</th><th>Core flags</th><th>Advanced flags</th></tr></thead><tbody>${studentRows}</tbody></table></div>

  /* ---------- skills ---------- */

    const errs = {}; Ss.forEach(S => S.errors.forEach(e => errs[e] = (errs[e] || 0) + 1));
