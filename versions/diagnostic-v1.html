<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths readiness diagnostic</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F7F8F6; --ink:#1E2A32; --ink-soft:#4A5860; --rule:#D5DBDD;
  --field:#FFFFFF; --accent:#2A6F8F; --accent-ink:#FFFFFF; --wash:#E8F0F4;
  --good:#3B7A57; --bad:#B4553A; --warn:#8A6D1F; --good-wash:#E6F0EA; --bad-wash:#F5E6E1;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B;
  --field:#1F262B; --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
  --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620;
}}
:root[data-theme="dark"]{
  --paper:#171C20; --ink:#E8ECEE; --ink-soft:#A9B4BA; --rule:#3A444B;
  --field:#1F262B; --accent:#6FB1CE; --accent-ink:#0F1418; --wash:#22303A;
  --good:#7FC29B; --bad:#E0907A; --warn:#D9B85E; --good-wash:#1F3128; --bad-wash:#3A2620;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 5rem}
main.wide{max-width:70rem}
h1{font-size:1.85rem;line-height:1.2;margin:0 0 .75rem;font-weight:700}
h2{font-size:1.3rem;margin:2.25rem 0 .75rem;font-weight:700}
h3{font-size:1.05rem;margin:1.5rem 0 .5rem;font-weight:700}
p{margin:0 0 1rem}
p.lead{font-size:1.1rem;color:var(--ink-soft)}
a{color:var(--accent)}
small,.muted{color:var(--ink-soft)}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
button,.btn{font:inherit;font-size:1rem;padding:.6rem 1.1rem;border-radius:.4rem;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.quiet,.btn.quiet{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
input[type=text],input[type=number],select{font:inherit;font-size:1rem;padding:.5rem .65rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);color:var(--ink);max-width:100%}
input[type=text]{width:100%}
label.check{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
label.check input{margin-top:.3rem;width:1.05rem;height:1.05rem;flex:none}
fieldset{border:1px solid var(--rule);border-radius:.5rem;padding:.75rem 1rem 1rem;margin:0 0 1.25rem}
legend{padding:0 .4rem;font-weight:700}
.topic-block{margin:0 0 1rem}
.topic-block .skills{padding-left:1.7rem}
.notice{background:var(--wash);border-left:4px solid var(--accent);padding:.75rem 1rem;border-radius:0 .4rem .4rem 0;margin:1rem 0}
.notice.bad{border-color:var(--bad);background:var(--bad-wash)}
.notice.good{border-color:var(--good);background:var(--good-wash)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.urlbox{display:block;width:100%;padding:.75rem;border:1.5px solid var(--rule);border-radius:.4rem;background:var(--field);word-break:break-all;margin:.5rem 0}
/* the sitting */
.topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);padding:.6rem 0;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;z-index:2}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.item{padding:1.5rem 0 1.75rem;border-bottom:1px solid var(--rule)}
.item:last-of-type{border-bottom:0}
.item .num{color:var(--ink-soft);margin-bottom:.35rem}
.stem{font-size:1.25rem;line-height:1.45;margin:0 0 1rem}
.stem .katex{font-size:1.05em}
label.opt .katex{font-size:1.05em}
.plot{width:100%;max-width:280px;height:auto;display:block;margin:.5rem 0 1rem}
.opts{display:grid;gap:.5rem;margin:0}
.opts.figs{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
label.opt{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border:1.5px solid var(--rule);border-radius:.5rem;background:var(--field);cursor:pointer;font-size:1.08rem}
label.opt input{width:1.15rem;height:1.15rem;flex:none;margin:0}
label.opt:has(input:checked){border-color:var(--accent);background:var(--wash)}
label.opt .plot{margin:0;max-width:100%}
label.opt.fig{flex-direction:column;align-items:stretch}
label.opt.fig .plot{max-width:none}
label.opt.fig .caption{display:flex;gap:.6rem;align-items:center}
.opt.idk{color:var(--ink-soft)}
.opts.figs .opt.idk{grid-column:1/-1;justify-content:center}
.conf{margin-top:.75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--ink-soft)}
.conf button{padding:.3rem .7rem;font-size:.92rem;border-color:var(--rule);background:transparent;color:var(--ink)}
.conf button.on{border-color:var(--accent);background:var(--wash)}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:.4rem}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.result-list{list-style:none;padding:0;margin:0}
.result-list li{padding:.6rem 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1.6rem 1fr auto;gap:.6rem;align-items:baseline}
.mark{font-weight:700}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}.mark.skip{color:var(--ink-soft)}
/* analysis */
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:.5rem 0 1.5rem}
th,td{text-align:left;padding:.45rem .55rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700}
.scroll{overflow-x:auto}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:2.6rem}
.heat th.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:400;white-space:nowrap;padding:.3rem}
.tag{display:inline-block;padding:.1rem .45rem;border-radius:.3rem;background:var(--wash);font-size:.9em;margin:.1rem .2rem .1rem 0}
details{margin:.5rem 0}
summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
@media (max-width:600px){html{font-size:16px} main{padding:1.5rem 1rem 4rem} .stem{font-size:1.15rem}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ==========================================================================
   ITEM BANK
   Everything a diagnostic can ask lives here. To add an item, append it to
   ITEMS. To add a skill, append it to SKILLS (never reorder: the position of a
   skill in this list is the bit that the share code uses, so reordering would
   silently change what an old link asks).

   Item fields
     id      short unique code
     skill   the SKILLS id the item measures
     plain   the stem in everyday language          (KaTeX allowed inside $...$)
     tech    the stem in mathematical language
     fig     optional graph shown with the stem: {fns:[...], x:[a,b], y:[a,b], ticks:[dx,dy]}
     opts    answer options. Exactly one has ok:1. Wrong options carry e:"error-tag".
             An option may carry fig instead of text; give it t as the spoken label.
   ========================================================================== */
const BANK_VERSION = "2026-09-17.1";

const TOPICS = [

/* Error tags: what a particular wrong answer most likely means.
   Written for the teacher, not the student. */
const ERRORS = {

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Render text with $...$ maths through KaTeX. Falls back to the raw TeX if the
   library did not load, so the sitting still works offline. */
function tex(str){
  const parts = String(str).split(/(\$[^$]+\$)/g);
  return parts.map(p => {
    if(p.startsWith("$") && p.endsWith("$") && p.length > 2){
      const src = p.slice(1,-1);
      if(window.katex){ try { return katex.renderToString("\\displaystyle " + src, {throwOnError:false}); } catch(e){} }
      return "<code>" + esc(src) + "</code>";
    }
    return esc(p);
  }).join("");
}
/* Plain-text version of an option, for the results file. */
function plainText(str){ return String(str).replace(/\$/g,"").replace(/\\(frac|dfrac)\{([^}]*)\}\{([^}]*)\}/g,"$2/$3").replace(/\\(times|cdot)/g,"×").replace(/\\(le|leq)/g,"≤").replace(/\\(ge|geq)/g,"≥").replace(/\\neq/g,"≠").replace(/\\sqrt\{([^}]*)\}/g,"√($1)").replace(/\\left|\\right/g,"").replace(/\\,/g," ").replace(/\\%/g,"%").replace(/\\pi/g,"π").replace(/\\log/g,"log").replace(/[{}]/g,""); }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function b64uEncode(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uDecode(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length % 4) str += "="; const s = atob(str); return Uint8Array.from(s, c => c.charCodeAt(0)); }

/* Draw a small graph. fns are strings in x, e.g. "x*x-4". */
function plotSVG(fig, small){
  const w = small ? 200 : 280, h = small ? 160 : 220, pad = 22;
  const [x0, x1] = fig.x, [y0, y1] = fig.y, [dx, dy] = fig.ticks || [1, 1];
  const sx = x => pad + (x - x0) / (x1 - x0) * (w - 2 * pad);
  const sy = y => h - pad - (y - y0) / (y1 - y0) * (h - 2 * pad);
  let s = `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(fig.label || "graph")}">`;
  s += `<rect x="${pad}" y="${pad}" width="${w - 2 * pad}" height="${h - 2 * pad}" fill="var(--field)" stroke="none"/>`;
  for(let x = Math.ceil(x0); x <= x1; x += dx){ s += `<line x1="${sx(x)}" y1="${pad}" x2="${sx(x)}" y2="${h - pad}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || x % (2 * dx) === 0) s += `<text x="${sx(x)}" y="${h - pad + 14}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${x}</text>`; }
  for(let y = Math.ceil(y0); y <= y1; y += dy){ s += `<line x1="${pad}" y1="${sy(y)}" x2="${w - pad}" y2="${sy(y)}" stroke="var(--rule)" stroke-width="1"/>`; if(!small || y % (2 * dy) === 0) s += `<text x="${pad - 4}" y="${sy(y) + 3.5}" font-size="10" text-anchor="end" fill="var(--ink-soft)">${y}</text>`; }
  if(x0 <= 0 && x1 >= 0) s += `<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${h - pad}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  if(y0 <= 0 && y1 >= 0) s += `<line x1="${pad}" y1="${sy(0)}" x2="${w - pad}" y2="${sy(0)}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  s += `<text x="${w - pad + 4}" y="${(y0 <= 0 && y1 >= 0) ? sy(0) + 4 : h - pad}" font-size="11" fill="var(--ink-soft)" font-style="italic">x</text>`;
  s += `<text x="${(x0 <= 0 && x1 >= 0) ? sx(0) + 4 : pad}" y="${pad - 6}" font-size="11" fill="var(--ink-soft)" font-style="italic">y</text>`;
  for(const f of fig.fns){
    const fn = new Function("x", "return " + f);
    let d = "", pen = false;
    for(let i = 0; i <= 160; i++){
      const x = x0 + (x1 - x0) * i / 160; const y = fn(x);
      if(!isFinite(y) || y < y0 - 0.5 || y > y1 + 0.5){ pen = false; continue; }
      d += (pen ? " L" : " M") + sx(x).toFixed(1) + " " + sy(Math.max(y0, Math.min(y1, y))).toFixed(1); pen = true;
    }
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  return s + "</svg>";
}

/* ==========================================================================
   CONFIGURATION AND THE SHARE CODE
   The code is a compact byte packing, base64url encoded: about 15 characters
   plus the label. It is not a hash: a hash could not be turned back into the
   settings, so compression, not hashing, is what keeps the link short.
   ========================================================================== */
const DEFAULT_CFG = {v:1, lang:0, ident:1, idk:true, conf:false, showScore:true, showItems:true, showAnswers:false, shuffle:true, allowBack:true, perSkill:2, viewLock:0, k:5, timer:0, skills:SKILLS.map(s => s.id), seed:1, label:""};

function encodeCfg(c){
  const b = [1, c.lang | c.ident << 2 | (c.idk ? 16 : 0) | (c.conf ? 32 : 0) | (c.showScore ? 64 : 0) | (c.showItems ? 128 : 0),
    c.perSkill | c.viewLock << 2 | (c.k & 15) << 4, (c.showAnswers ? 1 : 0) | (c.shuffle ? 2 : 0) | (c.allowBack ? 4 : 0), c.timer & 255];
  let mask = 0; c.skills.forEach(id => { const i = SKILLS.findIndex(s => s.id === id); if(i >= 0) mask |= (1 << i); });
  b.push(mask & 255, mask >>> 8 & 255, mask >>> 16 & 255, mask >>> 24 & 255, c.seed & 255, c.seed >>> 8 & 255);
  const label = new TextEncoder().encode(c.label || "");
  return b64uEncode(Uint8Array.from([...b, ...label]));
}
function decodeCfg(code){
  const u = b64uDecode(code); if(u.length < 11 || u[0] !== 1) throw new Error("bad code");
  const c = {v:1};
  c.lang = u[1] & 3; c.ident = u[1] >> 2 & 3; c.idk = !!(u[1] & 16); c.conf = !!(u[1] & 32); c.showScore = !!(u[1] & 64); c.showItems = !!(u[1] & 128);
  c.perSkill = u[2] & 3 || 1; c.viewLock = u[2] >> 2 & 3; c.k = u[2] >> 4 & 15 || 5;
  c.showAnswers = !!(u[3] & 1); c.shuffle = !!(u[3] & 2); c.allowBack = !!(u[3] & 4);
  c.timer = u[4];
  const mask = (u[5] | u[6] << 8 | u[7] << 16 | u[8] << 24) >>> 0;
  c.skills = SKILLS.filter((s, i) => mask & (1 << i)).map(s => s.id);
  c.seed = u[9] | u[10] << 8;
  c.label = new TextDecoder().decode(u.slice(11));
  return c;
}
function baseUrl(){ return location.href.split("#")[0]; }

/* Build the ordered list of items and options for a config. Deterministic:
   the same code always produces the same sitting. */
function assemble(cfg){
  const rng = mulberry32(cfg.seed * 7919 + 17);
  let items = [];
  for(const s of SKILLS){
    if(!cfg.skills.includes(s.id)) continue;
    const pool = shuffle(ITEMS.filter(it => it.skill === s.id), rng);
    items.push(...pool.slice(0, cfg.perSkill));
  }
  if(cfg.shuffle) items = shuffle(items, rng);
  return items.map((it, n) => {
    const variant = cfg.lang === 2 ? (rng() < 0.5 ? "plain" : "tech") : (cfg.lang === 1 ? "tech" : "plain");
    const opts = shuffle(it.opts.map((o, i) => ({...o, src:i})), rng);
    if(cfg.idk) opts.push({t:"I don't know", idk:1});
    return {n:n + 1, item:it, variant, opts};
  });
}

  ${c.ident ? `<h2>${c.ident === 3 ? "Your name" : c.ident === 2 ? "Your code" : "A nickname"}</h2><p>${identLabel}</p><input type="text" id="ident" maxlength="60" autocomplete="off">` : ""}

}

/* ==========================================================================
   STUDENT: THE SITTING
   ========================================================================== */
function startRun(code, c, plan, ident, vm, saved){
  const pageSize = vm === 1 ? 1 : vm === 2 ? plan.length : c.k;
  run = {code, c, plan, ident, vm, pageSize, page:0, answers:{}, started:Date.now(), lastEvent:Date.now(), timedOut:false, finished:false};
  if(saved){ run.answers = saved.answers || {}; run.started = saved.started || run.started; run.page = saved.page || 0; }
  if(c.timer){ run.deadline = run.started + c.timer * 60000; run.tick = setInterval(tickTimer, 1000); }
  renderPage();
}
function persist(){ if(run && !run.finished) localStorage.setItem("dewmath:" + run.code, JSON.stringify({answers:run.answers, started:run.started, page:run.page})); }
function tickTimer(){
  const el = $("#timer"); if(!run || run.finished) return;
  const left = Math.max(0, run.deadline - Date.now());
  if(el){ const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); el.textContent = `${m}:${String(s).padStart(2, "0")} left`; el.classList.toggle("low", left < 120000); }
  if(left <= 0){ run.timedOut = true; finishRun(); }
}

function renderPage(){
  app.className = "";
  const {plan, pageSize, page, c} = run;
  const pages = Math.ceil(plan.length / pageSize);
  const slice = plan.slice(page * pageSize, (page + 1) * pageSize);
  const answered = Object.keys(run.answers).length;
  const items = slice.map(p => {
    const it = p.item, a = run.answers[it.id] || {};
    const figOpts = p.opts.some(o => o.fig);
    return `<section class="item" data-id="${it.id}">
      <div class="num">Question ${p.n} of ${plan.length}</div>
      <p class="stem">${tex(p.variant === "tech" ? it.tech : it.plain)}</p>
      ${it.fig ? plotSVG(it.fig) : ""}
      <div class="opts ${figOpts ? "figs" : ""}" role="radiogroup">
        ${p.opts.map((o, i) => `<label class="opt ${o.fig ? "fig" : ""} ${o.idk ? "idk" : ""}">${o.fig ? plotSVG(o.fig, true) + `<span class="caption"><input type="radio" name="q-${it.id}" value="${o.idk ? "idk" : i}" ${String(a.choice) === String(o.idk ? "idk" : i) ? "checked" : ""}> Graph ${"ABCDEF"[i]}</span>` : `<input type="radio" name="q-${it.id}" value="${o.idk ? "idk" : i}" ${String(a.choice) === String(o.idk ? "idk" : i) ? "checked" : ""}><span>${tex(o.t)}</span>`}</label>`).join("")}
      </div>
      ${c.conf ? `<div class="conf">How sure are you? ${["Sure", "Fairly sure", "Guessing"].map(l => `<button type="button" data-conf="${l}" class="${a.conf === l ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}
    </section>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><div><strong>${esc(c.label || "Maths readiness check")}</strong><div class="progress" aria-hidden="true"><div style="width:${answered / plan.length * 100}%"></div></div></div>
    <div class="timer" id="timer"></div></div>
  ${items}
  <div class="nav">
    <div>${page > 0 && (c.allowBack || pageSize === plan.length) ? `<button class="quiet" id="prev">Back</button>` : ""}</div>
    <div>${page < pages - 1 ? `<button id="next">Next</button>` : `<button id="finish">Finish</button>`}</div>
  </div>`;
  if(c.timer) tickTimer();
  app.querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", e => {
    const id = e.target.name.slice(2), now = Date.now();
    const prev = run.answers[id] || {};
    run.answers[id] = {choice:e.target.value === "idk" ? "idk" : +e.target.value, conf:prev.conf, seconds:prev.seconds ?? Math.round((now - run.lastEvent) / 1000)};
    run.lastEvent = now; persist();
    const bar = app.querySelector(".progress div"); if(bar) bar.style.width = (Object.keys(run.answers).length / plan.length * 100) + "%";
  }));
  app.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => {
    const id = b.closest(".item").dataset.id; run.answers[id] = {...(run.answers[id] || {}), conf:b.dataset.conf};
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); persist();
  }));
  if($("#prev")) $("#prev").addEventListener("click", () => { run.page--; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#next")) $("#next").addEventListener("click", () => { run.page++; persist(); renderPage(); window.scrollTo(0, 0); });
  if($("#finish")) $("#finish").addEventListener("click", () => {
    const left = plan.length - Object.keys(run.answers).length;
    if(left && !confirm(`You have ${left} unanswered question${left > 1 ? "s" : ""}. Finish anyway? Unanswered questions are recorded as not attempted.`)) return;
    finishRun();
  });
}

function buildResult(){
  const {plan, c, answers} = run;
  const skills = {};
  const items = plan.map(p => {
    const it = p.item, a = answers[it.id], sk = skillById[it.skill];
    if(!skills[sk.id]) skills[sk.id] = {name:sk.name, topic:sk.topic, total:0, correct:0, idk:0, unanswered:0, errors:[]};
    const S = skills[sk.id]; S.total++;
    let rec = {n:p.n, id:it.id, skill:sk.id, topic:sk.topic, variant:p.variant, answered:!!a, choice:null, correct:null, error:null, confidence:a ? a.conf || null : null, seconds:a ? a.seconds : null};
    if(!a){ S.unanswered++; return rec; }
    if(a.choice === "idk"){ rec.choice = "I don't know"; rec.correct = false; S.idk++; return rec; }
    const o = p.opts[a.choice]; rec.choice = plainText(o.t); rec.correct = !!o.ok; rec.error = o.e || null; rec.position = a.choice;
    if(o.ok) S.correct++; else if(o.e) S.errors.push(o.e);
    return rec;
  });
  const answered = items.filter(i => i.answered).length, correct = items.filter(i => i.correct).length;
  return {
    schema:"dewmath-result/1", bankVersion:BANK_VERSION, generatedAt:new Date().toISOString(),
    config:{code:run.code, label:c.label, language:["plain", "technical", "mixed"][c.lang], identityMode:["anonymous", "pseudonym", "code", "name"][c.ident], timerMinutes:c.timer, skills:c.skills},
    student:{identity:run.ident || null}, viewMode:["", "one-at-a-time", "all-at-once", "paged"][run.vm],
    elapsedSeconds:Math.round((Date.now() - run.started) / 1000), timedOut:run.timedOut,
    items, summary:{total:plan.length, answered, correct, skills},
    dictionary:{skills:Object.fromEntries(Object.keys(skills).map(k => [k, skillById[k].name])), topics:Object.fromEntries(TOPICS.map(t => [t.id, t.name])), errors:Object.fromEntries([...new Set(items.map(i => i.error).filter(Boolean))].map(e => [e, ERRORS[e] || e]))}
  };
}

function finishRun(){
  if(run.finished) return; run.finished = true; clearInterval(run.tick);
  localStorage.removeItem("dewmath:" + run.code);
  const r = buildResult(); const c = run.c;
  const safe = (r.student.identity || "anonymous").replace(/[^\w\-]+/g, "_").slice(0, 30);
  const fname = `dewmath-${safe}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  const blob = new Blob([JSON.stringify(r, null, 1)], {type:"application/json"});
  const href = URL.createObjectURL(blob);
  const list = c.showItems ? `<h2>Question by question</h2><ul class="result-list">${r.items.map((i, k) => {
    const p = run.plan[k]; const mark = !i.answered ? ["skip", "–", "Not attempted"] : i.choice === "I don't know" ? ["skip", "?", "I don't know"] : i.correct ? ["ok", "✓", "Correct"] : ["no", "✗", "Not this time"];
    const ans = c.showAnswers && !i.correct ? `<small>Correct answer: ${tex(p.opts.find(o => o.ok).t)}</small>` : "";
    return `<li><span class="mark ${mark[0]}">${mark[1]}</span><span>${tex(p.variant === "tech" ? p.item.tech : p.item.plain)}<br><small>${esc(skillById[i.skill].name)}</small></span><span>${mark[2]}<br>${ans}</span></li>`; }).join("")}</ul>` : "";
  app.innerHTML = `
  <h1>Finished</h1>
  ${run.timedOut ? `<p class="notice">The time ran out, so this is what you had answered by then.</p>` : ""}
  <p class="lead">Thank you. Download your results file now and send it to your teacher in the way they asked.</p>
  <p><a class="btn" id="dl" href="${href}" download="${fname}">Download my results file</a></p>
  <p class="muted">The file is called <span class="code">${esc(fname)}</span>. It records your answers and nothing else. It does not leave this device until you send it.</p>
  ${c.showScore ? `<h2>Your score</h2><p class="lead">${r.summary.correct} out of ${r.summary.total}${r.summary.answered < r.summary.total ? ` (${r.summary.total - r.summary.answered} not attempted)` : ""}</p><p>A low score on some topics is the useful outcome here: it tells your teacher where to start.</p>` : ""}
  ${list}`;
  window.scrollTo(0, 0);
}

/* ==========================================================================
   TEACHER: CLASS ANALYSIS
   ========================================================================== */
function renderAnalysis(){
  app.className = "wide";
  app.innerHTML = `
  <h1>Class analysis</h1>
  <p class="lead">Open the results files your students downloaded. Everything is worked out in this page; nothing is uploaded anywhere.</p>
  <p><a href="${baseUrl()}">Back to the builder</a></p>
  <p><input type="file" id="files" multiple accept=".json,application/json"> <small>Select all the files at once, or add more in a second selection.</small></p>
  <div id="out"></div>`;
  const results = [];
  $("#files").addEventListener("change", async e => {
    for(const f of e.target.files){
      try { const r = JSON.parse(await f.text()); if(r.schema !== "dewmath-result/1") throw 0; r._file = f.name; results.push(r); }
      catch(err){ $("#out").insertAdjacentHTML("afterbegin", `<p class="notice bad">${esc(f.name)} is not a results file from this diagnostic, so it was skipped.</p>`); }
    }
    e.target.value = ""; renderReport(results);
  });
}

function renderReport(results){
  if(!results.length) return;
  const names = results.map((r, i) => r.student.identity || `Student ${i + 1}`);
  const skillIds = [...new Set(results.flatMap(r => Object.keys(r.summary.skills)))].sort((a, b) => SKILLS.findIndex(s => s.id === a) - SKILLS.findIndex(s => s.id === b));
  const skillName = id => (skillById[id] || {}).name || results.find(r => r.dictionary.skills[id])?.dictionary.skills[id] || id;
  const errName = e => ERRORS[e] || results.find(r => r.dictionary.errors[e])?.dictionary.errors[e] || e;
  const pctOf = S => S && S.total ? S.correct / S.total : null;
  const flagged = S => S && S.total && S.correct / S.total <= 0.5;
  const cell = p => p === null ? `<td class="c muted">–</td>` : `<td class="c" style="background:${p <= .5 ? "var(--bad-wash)" : p < 1 ? "var(--wash)" : "var(--good-wash)"}">${Math.round(p * 100)}</td>`;

  const meanOf = id => { const Ss = results.map(r => r.summary.skills[id]).filter(S => S && S.total); return Ss.length ? Ss.reduce((a, S) => a + S.correct / S.total, 0) / Ss.length : 1; };
  const skillRows = skillIds.map(id => {
    const Ss = results.map(r => r.summary.skills[id]).filter(Boolean);
    const errs = {}; Ss.forEach(S => S.errors.forEach(e => errs[e] = (errs[e] || 0) + 1));
    const idk = Ss.reduce((a, S) => a + S.idk, 0);
    const top = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e, n]) => `<span class="tag">${esc(errName(e))} (${n})</span>`).join(" ");
    const mean = Ss.length ? Ss.reduce((a, S) => a + pctOf(S), 0) / Ss.length : null;
    return `<tr><td>${esc(skillName(id))}<br><small>${esc((topicById[(skillById[id] || {}).topic] || {}).name || "")}</small></td><td class="c">${Ss.length}</td>${cell(mean)}<td class="c">${Ss.filter(flagged).length}</td><td class="c">${idk}</td><td>${top || "<span class='muted'>none recorded</span>"}</td></tr>`;
  }).join("");
  const priorities = skillIds.map(id => ({id, n:results.filter(r => flagged(r.summary.skills[id])).length})).filter(x => x.n > 0).sort((a, b) => b.n - a.n || meanOf(a.id) - meanOf(b.id)).slice(0, 5);

  const studentRows = results.map((r, i) => {
    const fl = skillIds.filter(id => flagged(r.summary.skills[id]));
    const errs = r.items.filter(it => it.error).map(it => `<span class="tag">${esc(errName(it.error))}</span>`).join(" ");
    return `<tr><td>${esc(names[i])}<br><small>${esc(r._file)}</small></td><td class="c">${r.summary.correct}/${r.summary.total}</td><td class="c">${Math.round(r.elapsedSeconds / 60)} min${r.timedOut ? " (timed out)" : ""}</td><td>${fl.map(skillName).map(esc).join(", ") || "<span class='muted'>none</span>"}</td><td><details><summary>${r.items.filter(it => it.error).length} tagged errors</summary>${errs}</details></td></tr>`;
  }).join("");

  const heat = `<div class="scroll"><table class="heat"><thead><tr><th></th>${skillIds.map(id => `<th class="rot">${esc(skillName(id))}</th>`).join("")}</tr></thead><tbody>${results.map((r, i) => `<tr><td>${esc(names[i])}</td>${skillIds.map(id => cell(pctOf(r.summary.skills[id]))).join("")}</tr>`).join("")}</tbody></table></div>`;

  $("#out").innerHTML = `
  <h2>${results.length} result${results.length > 1 ? "s" : ""} loaded</h2>
  ${priorities.length ? `<div class="notice good"><strong>Where to start:</strong> ${priorities.map(p => `${esc(skillName(p.id))} (${p.n} of ${results.length} students)`).join("; ")}.</div>` : `<div class="notice good">No skill has half or more of its items missed by any student.</div>`}
  <p class="muted">A skill is flagged for a student when they got half or fewer of its items right, counting "I don't know" as a miss. With two or three items per skill this is a prompt to look closer, not a verdict.</p>
  <h2>By skill</h2>
  <div class="scroll"><table><thead><tr><th>Skill</th><th>Students</th><th>Mean %</th><th>Flagged</th><th>Don't know</th><th>Most common errors</th></tr></thead><tbody>${skillRows}</tbody></table></div>
  <h2>By student</h2>
  <div class="scroll"><table><thead><tr><th>Student</th><th>Score</th><th>Time</th><th>Flagged skills</th><th>Errors</th></tr></thead><tbody>${studentRows}</tbody></table></div>
  <h2>Percent correct, student by skill</h2>
  ${heat}
  <p><button class="quiet" id="csv">Download this grid as CSV</button></p>`;
  $("#csv").addEventListener("click", () => {
    const rows = [["student", ...skillIds.map(skillName)], ...results.map((r, i) => [names[i], ...skillIds.map(id => { const p = pctOf(r.summary.skills[id]); return p === null ? "" : Math.round(p * 100); })])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = "dewmath-class.csv"; a.click();
  });
}

route();
</script>
