    return `<tr><td>${esc(skillName(id))}<br><small class="tier t${skillTier(id)}">${TIERS[skillTier(id)]}</small> <small>${esc((topicById[skillTopic(id)] || {}).name || "")}</small></td><td class="c">${Ss.length}</td>${cell(meanOf(id))}<td class="c">${Ss.filter(flagged).length}${Ss.filter(watch).length ? ` <small>(+${Ss.filter(watch).length})</small>` : ""}</td><td class="c">${Ss.reduce((a, S) => a + S.idk, 0)}</td><td class="c">${Ss.reduce((a, S) => a + (S.words || 0), 0)}</td><td style="min-width:16rem">${top || "<span class='muted'>none recorded</span>"}</td></tr>`;
  }).join("");
  const skillChart = hbars(skillIds.map(id => ({label:skillName(id), value:meanOf(id) || 0, color:TOPIC_COLORS[skillTopic(id)]})).sort((a, b) => a.value - b.value), {rowH:20, label:"Mean percent correct by skill, lowest first"});
  const skills = `
    <h2>Skills</h2>
    <p class="muted">A skill is flagged for a student when their percentage on it is below ${TH.flag}%, and marked worth checking between ${TH.flag}% and ${TH.watch}%. With two items per skill, a flag means both were missed. The Flagged column shows flags, with worth-checking counts in brackets. Bars are coloured by topic.</p>
    ${skillChart}
    <div class="scroll"><table><thead><tr><th>Skill</th><th>Students</th><th>Mean %</th><th>Flagged</th><th>Don't know</th><th>Words</th><th>Most common errors</th></tr></thead><tbody>${skillRows}</tbody></table></div>`;

  /* ---------- errors ---------- */
  const errAll = {}; results.forEach(r => r.items.forEach(i => { if(i.error) errAll[i.error] = (errAll[i.error] || 0) + 1; }));
  const errRows = Object.entries(errAll).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([e, n]) => ({label:errName(e).length > 60 ? errName(e).slice(0, 58) + "…" : errName(e), value:n}));
  const errTop15 = Object.entries(errAll).sort((a, b) => b[1] - a[1]).slice(0, 15);
  const errors = `
    <h2>Errors</h2>
    <p class="muted">Every wrong option in the bank is tagged with the misunderstanding it most likely shows. Each count here is one student giving that tagged answer once, so the same student can appear more than once for the same tag.</p>
    ${errRows.length ? hbars(errRows, {max:Math.max(...errRows.map(r => r.value)), fmt:v => v + (v === 1 ? " answer" : " answers"), labelW:380, w:700, rowH:20, label:"Most frequent tagged errors"}) : "<p class='muted'>No tagged errors yet.</p>"}
    ${errTop15.length ? `<h3>What each of those was, with an example</h3><ul class="errlist">${errTop15.map(([e, n]) => `<li>${errCite(e, errName(e), false)} <span class="n">(${n} time${n > 1 ? "s" : ""})</span></li>`).join("")}</ul>` : ""}`;

  /* ---------- confidence and wording ---------- */
  let confBlock = "<p class='muted'>Confidence was not asked in these sittings.</p>";
  if(anyConf){
    const M = {}; ["Sure", "Fairly sure", "Guessing"].forEach(c => M[c] = {right:0, wrong:0, idk:0});
    results.forEach(r => r.items.forEach(i => { if(!i.confidence || !i.answered) return; const m = M[i.confidence] || (M[i.confidence] = {right:0, wrong:0, idk:0}); if(i.noAnswer) m.idk++; else if(i.correct) m.right++; else m.wrong++; }));
    const cw = results.map((r, i) => ({name:names[i], n:r.items.filter(it => it.confidence === "Sure" && it.answered && it.correct === false && !it.noAnswer).length})).sort((a, b) => b.n - a.n);
    confBlock = `<p class="muted">A confident wrong answer is one marked "Sure" that was wrong. It usually shows a firmly held misconception, and those are the first things to teach against.</p>
    <div class="grid2"><div class="scroll"><table><thead><tr><th>Student said</th><th>Right</th><th>Wrong</th><th>Don't know</th><th>Accuracy</th></tr></thead><tbody>
    ${Object.entries(M).map(([c, m]) => `<tr><td>${esc(c)}</td><td class="c">${m.right}</td><td class="c">${m.wrong}</td><td class="c">${m.idk}</td>${cell(m.right + m.wrong ? m.right / (m.right + m.wrong) : null)}</tr>`).join("")}</tbody></table></div>
    <div>${hbars(cw.slice(0, 12).map(x => ({label:x.name, value:x.n, color:"var(--bad)"})), {max:Math.max(1, ...cw.map(x => x.n)), fmt:v => v + " confident wrong", labelW:120, w:520, rowH:20, label:"Confident wrong answers by student"})}</div></div>`;
  }
  let wordsBlock = "";
  if(anyWords){
    const rows = results.map((r, i) => ({name:names[i], words:r.summary.words || 0, task:r.summary.task || 0, idk:(r.summary.idk || 0) - (r.summary.words || 0) - (r.summary.task || 0)})).sort((a, b) => (b.words + b.task) - (a.words + a.task));
    const bySkill = skillIds.map(id => ({id, n:results.reduce((a, r) => a + ((r.summary.skills[id] || {}).words || 0), 0)})).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 8);
    wordsBlock = `<h3>Students who said they did not understand</h3>
    <p class="muted">"Words" counts the answer "I don't understand some of the words in this question". "Asking" counts "I don't understand what the question is asking me to do". Both point at language before mathematics.</p>
    <div class="grid2"><div class="scroll"><table><thead><tr><th>Student</th><th>Words</th><th>Asking</th><th>Plain don't know</th></tr></thead><tbody>${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="c">${x.words}</td><td class="c">${x.task}</td><td class="c">${x.idk}</td></tr>`).join("")}</tbody></table></div>
    <div>${bySkill.length ? `<h4 style="margin:.5rem 0">Skills whose wording was flagged most</h4>` + hbars(bySkill.map(x => ({label:skillName(x.id), value:x.n})), {max:Math.max(...bySkill.map(x => x.n)), fmt:v => v + (v === 1 ? " time" : " times"), labelW:230, w:520, rowH:20, label:"Words not understood, by skill"}) : ""}</div></div>`;
  }
  let langBlock = "";
  if(anyMixed){
    const per = results.map((r, i) => { const P = r.items.filter(it => it.answered && it.variant === "plain"), T = r.items.filter(it => it.answered && it.variant === "tech"); return {name:names[i], plain:P.length ? P.filter(x => x.correct).length / P.length : null, tech:T.length ? T.filter(x => x.correct).length / T.length : null}; });
    const gap = per.filter(x => x.plain !== null && x.tech !== null).map(x => ({...x, gap:x.plain - x.tech})).sort((a, b) => b.gap - a.gap);
    langBlock = `<h3>Everyday against mathematical wording</h3>
    <p class="muted">When a student does much better on the everyday wording, the difference points to vocabulary. The two halves of each student's sitting are different questions, so treat a gap under 15 points as noise.</p>
    <div class="scroll"><table><thead><tr><th>Student</th><th>Everyday wording</th><th>Mathematical wording</th><th>Gap</th></tr></thead><tbody>
    ${gap.map(x => `<tr><td>${esc(x.name)}</td>${cell(x.plain)}${cell(x.tech)}<td class="c" style="${x.gap >= .15 ? "color:var(--bad);font-weight:700" : ""}">${Math.round(x.gap * 100) > 0 ? "+" : ""}${Math.round(x.gap * 100)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  const confidence = `<h2>Confidence and wording</h2>${confBlock}${wordsBlock}${langBlock}`;

  /* ---------- time ---------- */
  const timeRows = [1,2,3].map(t => { const ss = results.flatMap(r => r.items.filter(i => i.tier === t && i.seconds)).map(i => i.seconds); return ss.length ? {label:TIERS[t], value:ss.reduce((a, b) => a + b, 0) / ss.length} : null; }).filter(Boolean);
  const time = `<h2>Time</h2>
    <p class="muted">Seconds per question are measured from the previous answer, so they are exact in the one-at-a-time layout and approximate on a single page. A red bar marks a student who ran out of time.</p>
    <div class="grid2"><div>${hbars(timeRows, {max:Math.max(1, ...timeRows.map(r => r.value)), fmt:v => Math.round(v) + " s per question", labelW:110, w:420, label:"Mean seconds per question by level"})}</div>
    <div>${hbars(results.map((r, i) => ({label:names[i], value:r.elapsedSeconds / 60, color:r.timedOut ? "var(--bad)" : "var(--accent)"})).sort((a, b) => b.value - a.value), {max:Math.max(1, ...results.map(r => r.elapsedSeconds / 60)), fmt:v => Math.round(v) + " min", labelW:120, w:420, rowH:18, label:"Total time by student"})}</div></div>`;

  /* ---------- data ---------- */
  const heat = `<div class="scroll"><table class="heat"><thead><tr><th></th>${skillIds.map(id => `<th class="rot">${esc(skillName(id))}</th>`).join("")}</tr></thead><tbody>${results.map((r, i) => `<tr><td>${esc(names[i])}</td>${skillIds.map(id => cell(pctOf(r.summary.skills[id]))).join("")}</tr>`).join("")}</tbody></table></div>`;
  const data = `<h2>Data</h2>
    <p class="muted">Percent correct for every student on every skill. Red is below ${TH.flag}%, amber is below ${TH.watch}%, green is 100%. A dash means the skill was not attempted.</p>
    ${heat}
    <p><button class="quiet" id="csv">Download this grid as CSV</button> <button class="quiet" id="csv2">Download the student summary as CSV</button></p>`;

  /* ---------- thresholds ---------- */
  const thresholds = `<h2>Thresholds</h2>
    <p>Every label on this page comes from a number on this tab. Change a number and the whole report is redrawn. The settings are kept in this browser, so they will still be here next time.</p>
    <div class="thr">${Object.keys(TH_DEFAULT).map(k => `<label><span>${esc(TH_TEXT[k])}${k === "minItems" ? "" : k === "margin" ? ", in points" : ", as a percent"}</span><input type="number" data-th="${k}" value="${TH[k]}" min="0" max="${k === "minItems" ? 50 : 100}"></label>`).join("")}</div>
    <div class="row" style="margin-top:1rem"><button class="quiet" id="thReset">Reset to the defaults</button><small>Defaults: foundation below ${TH_DEFAULT.found}%, strong at ${TH_DEFAULT.strongAdv}% advanced and ${TH_DEFAULT.strongCore}% core, ready at ${TH_DEFAULT.readyCore}% core, flag below ${TH_DEFAULT.flag}%, worth checking below ${TH_DEFAULT.watch}%, ${TH_DEFAULT.minItems} items per level, timeout line ${TH_DEFAULT.timeoutPct}%, narrow margin ${TH_DEFAULT.margin} points.</small></div>`;

  const tabs = [["overview","Overview"],["students","Students"],["skills","Skills"],["errors","Errors"],["confidence","Confidence and wording"],["time","Time"],["data","Data"],["thresholds","Thresholds"]];
  const panes = {overview, students, skills, errors, confidence, time, data, thresholds};
  $("#out").innerHTML = `<nav class="tabs" aria-label="Report sections">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === activeTab ? "active" : ""}">${l}</button>`).join("")}</nav>
    ${tabs.map(([k]) => `<section class="pane" data-pane="${k}" ${k === activeTab ? "" : "hidden"}>${panes[k]}</section>`).join("")}`;
  $("#out").querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { activeTab = b.dataset.tab; $("#out").querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("active", x === b)); $("#out").querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== activeTab); window.scrollTo(0, 0); }));
  $("#out").querySelectorAll("[data-th]").forEach(inp => inp.addEventListener("change", () => { const t = loadTH(); t[inp.dataset.th] = Math.max(0, +inp.value || 0); saveTH(t); renderReport(results); }));
  $("#thReset").addEventListener("click", () => { saveTH({...TH_DEFAULT}); renderReport(results); });
  $("#csv").addEventListener("click", () => {
    const rows = [["student", "band", ...skillIds.map(skillName)], ...results.map((r, i) => [names[i], BANDS[bands[i].band], ...skillIds.map(id => { const p = pctOf(r.summary.skills[id]); return p === null ? "" : Math.round(p * 100); })])];
    downloadCSV(rows, "dewmath-class-skills.csv");
  });
  $("#csv2").addEventListener("click", () => {
    const rows = [["student", "band", "band reason", "correct", "attempted", "total", "foundation %", "core %", "advanced %", "dont know", "words", "asking", "skipped", "minutes", "timed out", "flagged skills"],
      ...results.map((r, i) => [names[i], BANDS[bands[i].band], bands[i].why, r.summary.correct, r.summary.answered, r.summary.total, ...[1,2,3].map(t => { const p = tierPct(r, t, TH); return p === null ? "" : Math.round(p * 100); }), r.summary.idk || 0, r.summary.words || 0, r.summary.task || 0, r.summary.skipped || 0, Math.round(r.elapsedSeconds / 60), r.timedOut ? "yes" : "no", skillIds.filter(id => flagged(r.summary.skills[id])).map(skillName).join("; ")])];
    downloadCSV(rows, "dewmath-class-students.csv");
  });
}
/* A small RFC 4180 reader: handles quoted fields, commas and quotes inside
   them, and both CRLF and LF line endings, which is what Excel and Forms
   both produce. */
function parseCSV(text){
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i + 1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if(c === '"') inQuotes = true;
    else if(c === ","){ row.push(field); field = ""; }
    else if(c === "\n" || c === "\r"){
      if(c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = ""; if(row.some(v => v !== "")) rows.push(row); row = [];
    } else field += c;
  }
  if(field !== "" || row.length) row.push(field);
  if(row.some(v => v !== "")) rows.push(row);
  return rows;
}
function downloadCSV(rows, name){
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name; a.click();
}

if(typeof window !== "undefined" && app){ window.addEventListener("hashchange", route); route(); }
</script>
